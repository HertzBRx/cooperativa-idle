<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b2a1e">
<title>Cooperativa: da carroça à central de reciclagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b2119; --bg2:#3b2a1e; --paper:#f6ecd6; --paper2:#efe0bf; --ink:#3a2a1c; --ink2:#6b5440;
  --green:#3f8f3a; --green2:#62b356; --red:#c2412d; --yellow:#e8b631; --blue:#3a7fc4; --line:#d6c29a;
  --shadow:0 3px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;overscroll-behavior:none}
h2,h3,#logo,#money,.tab,.cat,.big,.hot,.btn,#timer,.gHead b,.skymsg b,.binLbl,.ach .an,.item .nm{font-family:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:600}
body{display:flex;flex-direction:column;min-height:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.5}
.hidden{display:none!important}
/* ---------- topo */
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);color:var(--paper);border-bottom:3px solid #1d150f;position:sticky;top:0;z-index:30;flex-wrap:wrap}
#logo{font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:6px;font-size:15px}
#logo .rc,.coopHead .rc{display:inline-block;width:24px;height:24px;border-radius:6px;background:var(--green);text-align:center;line-height:24px;color:#fff}
#logo{min-width:0}#logoEmb{display:flex;flex-shrink:0}
#logo .txt{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emb{display:block;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.brk{display:none}
.coopHead{display:flex;align-items:center;gap:10px;margin:2px 0 8px;font-size:17px}
.coopHead b{font-family:"Fredoka","Nunito",sans-serif;font-weight:600}
.nameRow{display:flex;gap:6px;margin:8px 0 4px}
.nameRow input,#leSigla{flex:1;min-width:0;font:inherit;font-size:17px;padding:9px 10px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.nameRow input:focus,#leSigla:focus{outline:none;border-color:var(--green)}
#modal.wide{max-width:780px}
.logoEd{display:flex;gap:14px;align-items:flex-start}
.lePrev{flex:0 0 200px;position:sticky;top:-16px;z-index:2;text-align:center;background:#fffaf0;border:2px solid var(--line);border-radius:12px;padding:10px}
.lePrev canvas{width:180px;height:215px;display:block;margin:0 auto 4px}
.leOpts{flex:1;min-width:0}
.leOpts h4{margin:8px 0 5px}
.leRow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.leOpt{background:#fffaf0;border:2px solid var(--line);color:var(--ink);padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-width:58px}
.leOpt canvas{width:40px;height:40px}
.leOpt b{font-size:20px;line-height:1.1}
.leOpt.on,.leSw.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.leSw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.25);padding:0}
#leSigla{flex:0 1 110px;font-size:15px;padding:6px 8px;text-transform:uppercase}
#leSigla:disabled{opacity:.45}
#money{font-weight:800;font-size:18px;color:#ffe08a;font-variant-numeric:tabular-nums}
#rate{font-size:12px;color:#d9c7a3}
#cashLbl{font-size:10.5px;color:#d9c7a3;text-transform:uppercase;letter-spacing:.4px;line-height:1}
.floater.small{font-size:clamp(10px,1.5vw,13px);color:#ffe9b0}
.autoPill{position:absolute;transform:translate(-50%,0);background:rgba(47,125,74,.92);color:#fff;border:2px solid #1d150f;border-radius:14px;padding:2px 8px;font-size:clamp(9px,1.4vw,12px);white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.autoPill.off{background:rgba(138,106,74,.95)}
.autoPill span{margin-left:3px}
.repRow{display:flex;justify-content:space-between;margin:8px 0 2px;font-weight:700}
#repRange{width:100%;accent-color:var(--green)}
.repScale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-bottom:6px}
#phaseChip{background:#5a4230;border-radius:20px;padding:3px 10px;font-size:12px;white-space:nowrap}
#top .sp{flex:1}
.ibtn{background:#5a4230;color:var(--paper);width:34px;height:34px;font-size:17px;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.ibtn.off{opacity:.45;text-decoration:line-through}
/* ---------- layout */
#app{flex:1;display:flex;gap:10px;padding:10px;align-items:flex-start;max-width:1500px;width:100%;margin:0 auto}
#stage{flex:1;min-width:0;position:sticky;top:58px}
#sceneWrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:3px solid #1d150f;box-shadow:0 6px 0 rgba(0,0,0,.3)}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#sceneWrap.street #cv,#sceneWrap.sorting #cv{touch-action:none;cursor:grab}
#sceneWrap.dragging #cv{cursor:grabbing}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floater{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(12px,2.2vw,18px);color:#fff;text-shadow:0 2px 0 #000,0 0 4px #000;animation:floatUp 1.2s ease-out forwards;white-space:nowrap}
.floater.bad{color:#ff9a8a}.floater.money{color:#ffe08a}.floater.kg{color:#bff0b0}
@keyframes floatUp{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-50px}}
.hot{position:absolute;transform:translate(-50%,-50%);background:rgba(255,248,230,.92);color:var(--ink);border:2px solid #3a2a1c;border-radius:10px;padding:4px 9px;font-weight:800;font-size:clamp(11px,1.8vw,15px);box-shadow:0 3px 0 rgba(0,0,0,.35);display:flex;align-items:center;gap:5px;white-space:nowrap}
.hot small{font-weight:600;font-size:.8em;color:var(--ink2)}
.hot.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
.badge{position:absolute;transform:translate(-50%,-50%);background:rgba(30,20,12,.8);color:#fff;font-size:clamp(9px,1.4vw,12px);font-weight:700;padding:1px 5px;border-radius:6px;pointer-events:none}
/* rua HUD */
#streetHud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:6px;align-items:center;pointer-events:none}
#streetHud>*{pointer-events:auto}
#timer{background:rgba(30,20,12,.85);color:#fff;font-weight:800;border-radius:8px;padding:4px 10px;font-size:clamp(14px,2.6vw,22px);font-variant-numeric:tabular-nums}
#timer.warn{background:var(--red);animation:pulse2 .5s infinite}
@keyframes pulse2{50%{transform:scale(1.1)}}
#cartBox{flex:1;background:rgba(30,20,12,.85);border-radius:8px;padding:4px 8px;color:#fff;font-size:clamp(11px,1.8vw,14px);max-width:330px}
#cartBar{height:8px;background:#5a4a3a;border-radius:5px;overflow:hidden;margin-top:3px}
#cartFill{height:100%;background:var(--green2);width:0;transition:width .2s}
#cartFill.full{background:var(--yellow)}
#routeName{color:#fff;background:rgba(30,20,12,.7);border-radius:8px;padding:4px 8px;font-size:12px}
#btnBack{margin-left:auto;background:var(--yellow);color:var(--ink);font-weight:800;padding:7px 12px;box-shadow:var(--shadow)}
#itemTip{position:absolute;transform:translate(-50%,-130%);background:rgba(30,20,12,.9);color:#fff;font-size:12px;padding:2px 7px;border-radius:6px;pointer-events:none;white-space:nowrap}
/* barra de ações */
#actionBar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.big{flex:1;min-width:120px;padding:12px 10px;font-weight:800;font-size:16px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35);border-radius:10px}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.b-go{background:var(--blue)}.b-sort{background:#8a5a2b}.b-sell{background:var(--green)}
.big small{display:block;font-weight:600;font-size:11px;opacity:.9}
/* próximo objetivo */
#goalBox{margin-top:10px;background:#fffaf0;border:3px solid #1d150f;border-radius:12px;padding:9px 11px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.gHead{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px;align-items:baseline}
.gPct{font-weight:800;color:var(--green);font-size:13px}
.gList{margin-top:6px;display:grid;gap:2px}
.gLine{display:flex;gap:6px;font-size:13px;align-items:baseline}
.gLine>span:first-child{color:var(--red);font-weight:800;width:14px;flex-shrink:0}
.gLine.ok{color:var(--ink2)}.gLine.ok>span:first-child{color:var(--green)}
.gLine em{margin-left:auto;font-style:normal;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12px}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.25),0 0 0 0 rgba(232,182,49,0);filter:brightness(1)}50%{box-shadow:0 3px 0 rgba(0,0,0,.25),0 0 0 7px rgba(232,182,49,.45);filter:brightness(1.08)}}
/* avisos no céu */
#sky{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);width:min(90%,560px);display:flex;justify-content:center;pointer-events:none;z-index:6}
#sceneWrap.street #sky,#sceneWrap.sorting #sky{top:calc(6% + 34px)}
#sceneWrap.street .skymsg,#sceneWrap.sorting .skymsg{pointer-events:none;opacity:.93}
.skymsg{pointer-events:auto;cursor:pointer;background:rgba(255,251,236,.96);border:2px solid #3a2a1c;border-radius:12px;padding:6px 12px;font-size:13.5px;line-height:1.3;box-shadow:0 3px 0 rgba(0,0,0,.3);animation:skyIn .3s ease-out;text-align:center;position:relative;max-width:100%}
.skymsg>b{display:block;font-size:14.5px}
.skymsg.good{border-color:var(--green)}.skymsg.bad{border-color:var(--red);background:rgba(255,240,236,.97)}
.skymsg.ach{border-color:#e8b631;background:rgba(255,246,216,.97)}.skymsg.fact{border-color:var(--blue);background:rgba(234,243,251,.97)}
.skymsg .more{position:absolute;right:-6px;top:-8px;background:#3a2a1c;color:#fff;font-style:normal;font-size:10px;border-radius:8px;padding:1px 5px}
.skymsg.out{animation:skyOut .25s forwards}
@keyframes skyIn{from{transform:translateY(-12px);opacity:0}}
@keyframes skyOut{to{transform:translateY(-12px);opacity:0}}
/* minigame de triagem */
#sortHud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:6px;align-items:center;pointer-events:none}
#sortHud>*{pointer-events:auto}
#sortTitle{pointer-events:none!important;background:rgba(30,20,12,.85);color:#fff;border-radius:8px;padding:5px 10px;font-size:clamp(11px,1.8vw,14px)}
#sortTitle b{font-family:"Fredoka","Nunito",sans-serif;font-weight:600;margin-right:6px}
#btnSortExit{margin-left:auto;background:var(--yellow);color:var(--ink);font-weight:800;padding:7px 12px;box-shadow:var(--shadow)}
#sortMsg{position:absolute;left:50%;transform:translateX(-50%);top:calc(4% + 34px);width:min(92%,520px);background:rgba(255,251,236,.97);border:2px solid var(--green);border-radius:10px;padding:5px 10px;font-size:clamp(11px,1.9vw,14px);text-align:center;pointer-events:none;z-index:5}
#sortMsg.bad{border-color:var(--red);background:rgba(255,240,236,.97)}
#sortBins{position:absolute;inset:0;pointer-events:none}
.binLbl{position:absolute;transform:translate(-50%,-100%);color:#fff;font-size:clamp(9px,1.7vw,13px);padding:1px 6px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.c-azul{color:#2f6fb8}.c-verm{color:#d23a2a}.c-amar{color:#b8861a}.c-verde{color:#3f8f3a}.c-cinza{color:#6f7478}
.note{background:#e8f5e0;border-radius:8px;padding:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}
/* ---------- painel */
#panel{width:400px;flex-shrink:0;background:var(--paper);border-radius:12px;border:3px solid #1d150f;box-shadow:0 6px 0 rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
#tabs{display:flex;background:var(--paper2);border-bottom:2px solid var(--line)}
.tab{flex:1;background:none;padding:10px 4px;font-weight:700;color:var(--ink2);position:relative;border-radius:0;font-size:14px}
.tab.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 -3px 0 var(--green)}
.dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--paper)}
#tabBody{overflow-y:auto;padding:12px;flex:1;-webkit-overflow-scrolling:touch}
h3{margin:4px 0 8px;font-size:16px}
h4{margin:12px 0 6px;font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.card{background:#fffaf0;border:2px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.pbar{height:12px;background:#e3d3b0;border-radius:7px;overflow:hidden;border:1px solid #c9b48a}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));transition:width .3s}
.pbar.warn>div{background:linear-gradient(90deg,#d9822b,#e8b631)}
.pbar.full>div{background:linear-gradient(90deg,#b8321f,#d9532e)}
.req{display:flex;gap:6px;font-size:13px;padding:3px 0;align-items:flex-start}
.req .ok{color:var(--green);font-weight:800}.req .no{color:var(--red);font-weight:800}
.req span.v{margin-left:auto;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{background:var(--green);color:#fff;font-weight:700;padding:8px 12px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.alt{background:#8a6a4a}.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.wide{width:100%;margin-top:8px;padding:10px}
.stockRow{margin-bottom:10px}
.stockHead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11px;background:#f1e5c9;border-radius:10px;padding:2px 7px;display:flex;align-items:center;gap:4px}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.row{display:flex;gap:6px;align-items:center}
.warnTxt{color:var(--red);font-size:12px;font-weight:700;margin-top:3px}
.muted{color:var(--ink2);font-size:12px}
table.prices{width:100%;border-collapse:collapse;font-size:12px}
table.prices td,table.prices th{padding:3px 4px;border-bottom:1px solid #eadcb9;text-align:right}
table.prices td:first-child,table.prices th:first-child{text-align:left}
/* loja */
#cats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat{background:var(--paper2);color:var(--ink2);font-weight:700;font-size:12px;padding:6px 9px;position:relative;border:2px solid transparent}
.cat.on{background:#fff;border-color:var(--green);color:var(--ink)}
.cat .dot{top:-3px;right:-3px}
.item{display:flex;gap:10px}
.item .ic{width:40px;height:40px;flex-shrink:0;background:#f1e5c9;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:14px}
.item .ds{font-size:12px;color:var(--ink2);margin:2px 0 6px}
.item .cnt{font-size:11px;background:#e8dcc0;border-radius:8px;padding:1px 6px;margin-left:4px;font-weight:700;color:var(--ink2)}
.buyRow{display:flex;gap:4px;flex-wrap:wrap}
.buyRow .btn{padding:6px 7px;font-size:12px;flex:1;min-width:60px;line-height:1.15}
.buyRow .btn small{display:block;font-weight:600;font-size:10.5px;opacity:.95}
.item.locked{opacity:.75}.item.locked .ic{filter:grayscale(1) brightness(.8)}
.lockMsg{font-size:12px;color:#8a4a2a;font-weight:700}
.limitMsg{font-size:12px;color:#8a5a00;font-weight:700;background:#fff1c9;border-radius:6px;padding:4px 6px}
.item.mystery .nm{letter-spacing:3px}
details.done{margin-top:10px}
details.done summary{cursor:pointer;font-weight:700;color:var(--ink2);padding:6px 0}
.doneItem{font-size:12px;padding:3px 0;color:var(--ink2);border-bottom:1px dashed #e3d3b0}
.roleRow{display:flex;gap:8px;align-items:flex-start}
.roleRow .rn{font-weight:800}
.roleRow .cnt2{margin-left:auto;font-weight:800;font-size:15px;white-space:nowrap}
.moveBtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.moveBtns .btn{font-size:11px;padding:4px 7px}
/* conquistas */
.achGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{background:#fffaf0;border:2px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
.ach.on{border-color:#e8b631;background:#fff6d8}
.ach .an{font-weight:800;font-size:13px;margin-bottom:2px}
.ach.off{opacity:.78}
.ach.t-b.on{border-color:#c98a52;background:#fbeee0}.ach.t-p.on{border-color:#9aa7b0;background:#f1f4f6}.ach.t-o.on{border-color:#e8b631;background:#fff6d8}
.ach .pbar{height:7px;margin-top:5px}.ach .pv{font-size:11px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.ach.secret{background:#f0e8d6;border-style:dashed}
.achCat{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}
.achCat h4{margin:0}
.nearRow{margin:6px 0}.nearRow .nm{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
/* modal */
#modalBg{position:fixed;inset:0;background:rgba(15,10,5,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px}
#modal{background:var(--paper);border:3px solid #1d150f;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#modal h2{margin:0 0 8px;font-size:20px}
#modal p{margin:6px 0;line-height:1.4}
#modal ul{margin:6px 0;padding-left:20px;line-height:1.5}
.mBtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mBtns .btn{flex:1;padding:11px}
.routeCard{display:flex;gap:10px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fffaf0;width:100%;text-align:left;color:var(--ink)}
.routeCard:not(:disabled):hover{border-color:var(--blue)}
.routeCard .rnm{font-weight:800}
.routeCard canvas{width:72px;height:40px;border-radius:6px;image-rendering:pixelated;flex-shrink:0}
.sumTable{width:100%;border-collapse:collapse;margin:6px 0}
.sumTable td{padding:4px;border-bottom:1px solid #eadcb9}.sumTable td:last-child{text-align:right;font-weight:700}
.roleChoice{display:block;width:100%;text-align:left;background:#fffaf0;border:2px solid var(--line);padding:10px;margin-bottom:8px;color:var(--ink)}
.roleChoice:not(:disabled):hover{border-color:var(--green)}
/* tutorial */
#tutBubble{position:fixed;z-index:70;max-width:300px;background:#fffbe8;border:3px solid #e8b631;border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 6px 0 rgba(0,0,0,.3);line-height:1.35}
#tutBubble .tb{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
#tutBubble .tb button{font-size:12px;padding:5px 9px}
#tutHole{position:fixed;z-index:69;border-radius:12px;pointer-events:none;box-shadow:0 0 0 3px #ffe08a,0 0 16px 5px rgba(255,224,138,.85),0 0 0 9999px rgba(12,8,4,.42);animation:holeGlow 1.2s ease-in-out infinite}
@keyframes holeGlow{50%{box-shadow:0 0 0 4px #fff3b0,0 0 26px 9px rgba(255,224,138,.95),0 0 0 9999px rgba(12,8,4,.42)}}
#tutBubble .tt{line-height:1.38}
#tutBubble.wide{max-width:min(600px,94vw)}
#tutBubble.compact{display:flex;align-items:center;gap:10px;padding:7px 10px;max-width:min(640px,94vw)}#tutBubble.compact .tb{margin-top:0;flex-shrink:0}#tutBubble.compact .tt{font-size:13.5px}
@keyframes bob{50%{margin-top:-10px}}
#buildOverlay{position:absolute;inset:0;pointer-events:none}
/* responsivo */
@media (min-width:901px){ #sceneWrap{max-width:calc((100vh - 300px) * 16 / 9);margin:0 auto} }
@media (max-width:900px){
  #app{flex-direction:column;padding:8px;gap:8px}
  #stage{position:relative;top:0;width:100%}
  #panel{width:100%;max-height:none}
  #tabBody{overflow:visible}
  #top{flex-wrap:wrap;gap:4px 6px;padding:6px 8px}
  #logo{order:1;flex:1 1 auto;font-size:14px}#logo .txt{max-width:none}
  #btnMusic,#btnSfx,#btnHelp,#btnCfg{order:2}
  .brk{display:block;order:3;flex-basis:100%;height:0}
  #moneyBox{order:4}#phaseChip{order:5}#top .sp{order:6}
  .logoEd{flex-direction:column;align-items:stretch}
  .lePrev{position:sticky;top:-16px;z-index:2;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px;box-shadow:0 4px 8px rgba(0,0,0,.15)}
  .lePrev canvas{width:92px;height:110px;margin:0}
  .ibtn{width:30px;height:30px;font-size:15px}
  #phaseChip{max-width:34vw;overflow:hidden;text-overflow:ellipsis}

  body.inStreet #panel{display:none}
  .skymsg{font-size:12px;padding:4px 9px}.skymsg>b{font-size:12.5px}
  #goalBox{padding:7px 9px}.gLine{font-size:12.5px}
  .big{min-width:90px;font-size:15px;padding:10px 6px}
}
@media (max-width:420px){ .achGrid{grid-template-columns:1fr} #money{font-size:16px} }
.tmRow{display:flex;gap:10px;align-items:flex-start;padding:8px;border-bottom:1px solid var(--line)}
.tmRow:last-child{border-bottom:0}
.tmPic{width:40px;height:52px;image-rendering:pixelated;background:var(--paper2);border:2px solid var(--line);border-radius:8px;flex:none}
.tmInfo{flex:1;min-width:0}
.tmName{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-weight:600;font-size:15px}
.tmRole{font-size:13px;font-weight:700;color:var(--ink2)}
.tmEpi{display:flex;flex-wrap:wrap;gap:3px;margin:3px 0}
.tmEpi span{font-size:11px;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.tmEpi .none{opacity:.7}
.tmDays{font-size:12px}
.tmActs{display:flex;flex-direction:column;gap:4px;flex:none}
.tmActs .btn{padding:5px 8px;font-size:12px}
.teamList{background:var(--paper);border:2px solid var(--line);border-radius:12px;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.filtRow{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
.filtRow .cat{flex:none}
.filtRow .cat:disabled{opacity:.45}
.vagaGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.vagaBox{border:2px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px;display:flex;flex-direction:column;background:var(--paper2)}
.vagaBox.free{border-color:var(--green)}
@media (max-width:420px){.tab{font-size:12.5px;padding:10px 2px}.tmActs .btn{font-size:11.5px;padding:5px 6px}}

<body>
<header id="top">
  <div id="logo"><span id="logoEmb"><span class="rc">♻</span></span><span class="txt" id="coopName">Cooperativa</span></div>
  <div class="brk"></div>
  <div id="moneyBox"><div id="cashLbl">Seu dinheiro</div><div id="money">R$ 0,00</div><div id="rate">+R$ 0,00/s</div></div>
  <div id="phaseChip">Fase 1</div>
  <div class="sp"></div>
  <button class="ibtn" id="btnMusic" title="Música" aria-label="Ligar ou desligar música">♪</button>
  <button class="ibtn" id="btnSfx" title="Efeitos sonoros" aria-label="Ligar ou desligar efeitos">🔊</button>
  <button class="ibtn" id="btnHelp" title="Como jogar" aria-label="Como jogar">?</button>
  <button class="ibtn" id="btnCfg" title="Configurações" aria-label="Configurações">⚙</button>
</header>
<div id="app">
  <section id="stage">
    <div id="sceneWrap">
      <canvas id="cv"></canvas>
      <div id="hots"></div>
      <div id="floaters"></div>
      <div id="streetHud" class="hidden">
        <div id="timer">0:45</div>
        <div id="cartBox"><span id="cartTxt">0 / 25 kg</span><div id="cartBar"><div id="cartFill"></div></div></div>
        <button id="btnBack">Voltar à base</button>
      </div>
      <div id="sortHud" class="hidden">
        <div id="sortTitle"><b>Mesa de triagem</b><span id="sortCount"></span></div>
        <button id="btnSortExit">Sair da mesa</button>
      </div>
      <div id="sortBins" class="hidden"></div>
      <div id="sortMsg" class="hidden"></div>
      <div id="sky"></div>
      <div id="itemTip" class="hidden"></div>
      <div id="fade"></div>
    </div>
    <div id="actionBar">
      <button class="big b-go" id="btnGo">🛒 Ir para a rua<small id="goSub">Rua do bairro</small></button>
      <button class="big b-sort" id="btnSort">✋ Triar<small id="sortSub">0 kg misturado</small></button>
      <button class="big b-sell" id="btnSell">⚖ <span id="btnSellLbl">Vender</span><small id="sellSub">R$ 0,00</small></button>
    </div>
    <div id="goalBox"></div>
  </section>
  <aside id="panel">
    <nav id="tabs">
      <button class="tab on" data-tab="coop" id="tab-coop">Cooperativa</button>
      <button class="tab" data-tab="loja" id="tab-loja">Loja<span class="dot hidden" id="dotLoja"></span></button>
      <button class="tab" data-tab="equipe" id="tab-equipe">Equipe</button>
      <button class="tab" data-tab="ach" id="tab-ach">Conquistas</button>
      <button class="tab" data-tab="mais" id="tab-mais">Mais</button>
    </nav>
    <div id="tabBody"></div>
  </aside>
</div>
<div id="modalBg" class="hidden"><div id="modal"></div></div>
<div id="tutBubble" class="hidden"></div>
<div id="tutHole" class="hidden"></div>

function autoWeights(){

function takeProp(store, keys, kg){

  const f = Math.min(1, kg / tot);
  keys.forEach(k => { const v = (store[k] || 0) * f; if (v > 0) { out[k] = v; store[k] -= v; if (store[k] < 1e-6) delete store[k]; } });

}

function tick(dt, offline){
  syncMembers();
  S.t += dt;
  if (S.ev.length) S.ev = S.ev.filter(e => e.until > S.t);
  const r = rates(), cap = caps();
  S._blkCol = false; S._blkTri = false;
  const inflow = (r.col + r.extra) * dt;
  if (inflow > 0) {
    const space = mixedSpace();
    if (space <= 0.001) S._blkCol = true;
    else {
      const a = Math.min(inflow, space); if (a < inflow) S._blkCol = true;
      const fc = r.col / (r.col + r.extra);
      addMixed(a * fc, rejFrac()); addMixed(a * (1 - fc), 0.03);
      S.st.autoKg += a;
    }
  }
  if (r.tri > 0) sortKg(r.tri * dt);
  if (r.gra > 0) makePellets(r.gra * dt);
  if (r.pre > 0) makeBales(r.pre * dt);
  if (r.ven > 0) sellAuto(r.ven * dt);
  if (r.money > 0) revenue(r.money * dt);
  if (shareOn() && S.repasse >= 0.5) S.st.fairTime += dt;
  S._repSec = (S._repSec || 0) + dt;
  while (S._repSec >= 1) { S._repSec -= 1; S._repWin = S._repWin || []; S._repWin.push(S._repBucket || 0); S._repBucket = 0; if (S._repWin.length > 60) S._repWin.shift(); }
  if (S.phase >= 5 && S.fundRes >= reservaMeta() - 0.01) S.flags.reserva = 1;
  if (rendaMes() >= SAL_MIN && (S._repWin || []).length >= 30) S.flags.salMin = 1;
  if (!offline) {
    checkAch();
    // eventos: o relógio corre desde a fase 2; se for hora durante o tutorial, a triagem ou uma janela aberta, espera um pouco
    if (S.phase >= 2) {
      S.nextEv -= dt;
      if (S.nextEv <= 0) {
        if (S.tut.done && HOOK.canEvent()) { S.nextEv = 90 + Math.random() * 90; fireEvent(); }
        else S.nextEv = 15;
      }
    }
  }
}

function buy(id, q){
  const it = ITEM[id]; if (itemStatus(it) !== 'avail') return 0;
  q = Math.min(q, remainingQty(it));
  let bought = 0;
  while (bought < q) {
    const c = itemCost(it), fund = Math.min(S.fundForm, c * fundShare(it));
    if (S.money < c - fund) break;
    S.fundForm -= fund; S.money -= c - fund; bought++;
    if (it.consumable) { S.mutUntil = Math.min(S.t + 600, Math.max(S.t, S.mutUntil || 0) + 120); break; }
    S.items[id] = nI(id) + 1;
  }
  return bought;
}

function hire(role){
  if (!canHire() || !roleOpen(role) || freeVaga(role) <= 0) return false;

  const m = {id:S.memSeq++, role, joined:S.t}; S.members.push(m);

}

function syncMembers(){ // mantém a lista igual às contagens (saves antigos, ajustes diretos)
  if (!S.members) S.members = [];
  if (S.memSeq == null) S.memSeq = S.members.reduce((a, m) => Math.max(a, m.id + 1), 0);
  for (const r of ROLE_IDS) {
    let have = 0; for (const m of S.members) if (m.role === r) have++;
    while (have < S.roles[r]) { S.members.push({id:S.memSeq++, role:r, joined:S.t}); have++; }
    while (have > S.roles[r]) { const i = S.members.map(m => m.role).lastIndexOf(r); S.members.splice(i, 1); have--; }
  }
}

  S.roles[m.role]--; S.roles[to]++; m.role = to; return true;
}

}

  let W = pool.reduce((a, e) => a + e.w, 0), x = Math.random() * W, e = pool[0];
  for (const p of pool) { x -= p.w; if (x <= 0) { e = p; break; } }

  const r = rates();
  if (e.id === 'doacao') {

    if (kg >= 1) { addMixed(kg, 0.05); ev.d = `Um comércio do bairro doou ${fmtKg(kg)} de material para a cooperativa.`; }

  } else if (e.id === 'escola') {
    const v = Math.max(40, Math.round(incomeEstimate() * 30));

  } else if (e.id === 'empresa') {
    const v = Math.max(25, Math.round(incomeEstimate() * 40 + tripCap() * 0.3));
    const quem = ['Um mercado do bairro', 'Uma empresa da região', 'A associação de moradores', 'Uma igreja do bairro'][Math.floor(Math.random() * 4)];
    addMoney(v); ev.d = `${quem} doou ${fmtMoney(v)} para a cooperativa investir em equipamentos.`;
  } else if (e.id === 'campanha') {
    const kg = Math.min(Math.max(30, Math.round(tripCap() * 2), Math.round((r.col + r.extra) * 80)), Math.floor(mixedSpace()));
    if (kg >= 1) { addMixed(kg, 0.02); ev.d = `Uma escola fez uma campanha de arrecadação e entregou ${fmtKg(kg)} de material limpo e separado.`; }
    else ev.d = 'Uma escola juntou material numa campanha, mas o estoque de misturado está cheio. Faça a triagem para abrir espaço!';
  } else if (e.id === 'chuva') {
    if (has('lona') || S.phase >= 5) { S.flags.chuva = 1; ev.good = 1; ev.d = S.phase >= 5 ? 'Choveu forte, mas o material estava protegido dentro do galpão!' : 'Choveu forte, mas a lona protegeu todo o material!'; }
    else {

    }

let _incHist = [];
function incomeEstimate(){ // R$/s aproximado da automação
  const r = rates();
  const sellKg = Math.min(r.ven, Math.max(r.tri, r.ven * 0.5));
  let avg = 0, T = 0; const w = autoWeights();

function fmtNum(v, d){

}
function fmtMoney(v){
  if (v >= 1e9) return 'R$ ' + fmtNum(v / 1e9, 2) + ' bi';
  if (v >= 1e6) return 'R$ ' + fmtNum(v / 1e6, 2) + ' mi';
  if (v >= 1e5) return 'R$ ' + fmtNum(Math.floor(v));

}

// ---------- partículas (poeira, fumaça, folhas)
const FX = [];
function spawnFx(mode, x, y, kind, n){
  for (let i = 0; i < (n || 1); i++) {
    if (FX.length > 260) FX.shift();
    const f = {mode, x, y, kind, t:0};
    if (kind === 'dust') { f.vx = (Math.random() - 0.5) * 14; f.vy = -4 - Math.random() * 6; f.life = 0.5 + Math.random() * 0.4; f.s = 1 + Math.random() * 2; f.c = Math.random() < 0.5 ? '#d8c8a8' : '#c4b08c'; }
    else if (kind === 'smoke') { f.vx = -3 - Math.random() * 3; f.vy = -6 - Math.random() * 4; f.life = 1.2 + Math.random() * 0.6; f.s = 2 + Math.random() * 2; f.c = Math.random() < 0.5 ? '#8a8a8a' : '#a5a5a5'; }
    else if (kind === 'leaf') { f.vx = 4 + Math.random() * 6; f.vy = 6 + Math.random() * 4; f.life = 3; f.s = 1; f.c = Math.random() < 0.5 ? '#5fa04a' : '#c9a14a'; f.ph = Math.random() * 6; }
    else if (kind === 'spark') { f.vx = (Math.random() - 0.5) * 30; f.vy = -10 - Math.random() * 20; f.life = 0.6; f.s = 1; f.c = ['#ffe08a', '#bff0b0', '#ffffff'][i % 3]; }
    FX.push(f);
  }
}
function updateFx(dt){
  for (const f of FX) {
    f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.kind === 'dust') f.vy += 10 * dt;
    if (f.kind === 'smoke') f.s += dt * 2.5;
    if (f.kind === 'leaf') f.x += Math.sin(f.t * 4 + f.ph) * 0.4;
    if (f.kind === 'spark') f.vy += 50 * dt;
  }
  for (let i = FX.length - 1; i >= 0; i--) if (FX[i].t >= FX[i].life) FX.splice(i, 1);
}
function drawFx(mode){
  for (const f of FX) {
    if (f.mode !== mode) continue;
    const a = 1 - f.t / f.life;
    alpha(f.kind === 'smoke' ? a * 0.45 : a * 0.8, () => rect(f.x - f.s / 2, f.y - f.s / 2, f.s, f.s, f.c));
  }
}

}
function drawSkyLife(t, w, cloudY, scale){
  for (let i = 0; i < 4; i++) {
    const sp = 1.5 + i * 0.8, x = ((t * sp + i * w / 3.3) % (w + 70)) - 50;
    drawCloud(x, cloudY + i * 6 * scale - (i % 2) * 3, scale * (i % 2 ? 0.7 : 1));
  }
  for (let i = 0; i < 3; i++) { // pássaros
    const x = ((t * (9 + i * 3) + i * 140) % (w + 60)) - 30, y = cloudY + 14 * scale + Math.sin(t * 1.3 + i) * 4 + i * 5;
    const f = Math.floor(t * 6 + i) % 2;
    rect(x, y, 1, 1, '#3a3a4a'); rect(x - 1, y - f, 1, 1, '#3a3a4a'); rect(x + 1, y - f, 1, 1, '#3a3a4a'); rect(x - 2, y - f * 2 + (f ? 0 : 1), 1, 1, '#3a3a4a'); rect(x + 2, y - f * 2 + (f ? 0 : 1), 1, 1, '#3a3a4a');
  }
}

function drawTree(x, y, s, t, mode){
  shadow(x, y, 26 * s);
  rect(x - 2, y - 18 * s, 4, 18 * s, '#6b4a2a'); rect(x - 2, y - 18 * s, 1, 18 * s, '#85603a'); rect(x + 1, y - 18 * s, 1, 18 * s, '#523820');
  rect(x - 5, y - 2, 3, 2, '#6b4a2a'); rect(x + 2, y - 2, 3, 2, '#6b4a2a');
  const r = rng(Math.round(x * 7 + y));
  for (let i = 0; i < 34; i++) {
    const a = r() * Math.PI * 2, d = r() * 11 * s, sw = Math.sin(t * 1.4 + i * 0.3 + x) * (0.6 + d / 10);
    const bx = x + Math.cos(a) * d * 1.3 - 4 + sw, by = y - 26 * s + Math.sin(a) * d * 0.8 - 3;
    const top = Math.sin(a) < -0.2;
    rect(bx, by, 8, 6, top ? '#6cb04f' : i % 3 ? '#4f8a3c' : '#3f7a30');
    if (top && i % 4 === 0) rect(bx + 2, by + 1, 3, 1, '#8fcf6a');
  }
  if (mode && Math.random() < 0.004) spawnFx(mode, x + (Math.random() - 0.5) * 20 * s, y - 24 * s, 'leaf');
}

function compColors(store){
  const out = []; let T = 0; for (const k in store) T += store[k];
  if (T <= 0) return ['#b8864b'];

}

function pileIn(x, bottom, w, h, fill, cols){
  if (fill <= 0) return;
  const hh = Math.min(h + 6, h * fill + 1), r = rng(13);
  for (let yy = 0; yy < hh; yy += 2) for (let xx = 0; xx < w; xx += 3) {
    const curve = yy > h ? (Math.abs(xx - w / 2) < (w / 2) * (1 - (yy - h) / 7)) : true;
    if (curve) rect(x + xx, bottom - yy - 2, 3, 2, cols[Math.floor(r() * cols.length)]);
  }
}

const tintCache = new Map();
function tinted(spr, k){
  if (!k) return spr;
  let m = tintCache.get(spr); if (!m) tintCache.set(spr, m = {});
  if (m[k]) return m[k];
  const c = mkCanvas(spr.width, spr.height), g = c.getContext('2d'); g.drawImage(spr, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), f = [[1.08, 1, 0.94], [0.93, 0.97, 1.06], [1.04, 1.06, 0.95]][k - 1];
  for (let i = 0; i < d.data.length; i += 4) for (let j = 0; j < 3; j++) d.data[i + j] = Math.min(255, d.data[i + j] * f[j]);
  g.putImageData(d, 0, 0);
  return m[k] = c;
}

// desenha um item com espelho e rotação, apoiado no chão em (x, y)
function drawVarItem(it, lift){
  const s = it.spr;
  if (!it.flip && !it.rot) { CX.drawImage(s, Math.round(it.x - s.width / 2), Math.round(it.y - s.height - (lift || 0))); return; }
  CX.save(); CX.translate(Math.round(it.x), Math.round(it.y - s.height / 2 - (lift || 0)));
  if (it.rot) CX.rotate(it.rot); if (it.flip) CX.scale(-1, 1);

}

// as primeiras peças de cada saída garantem uma boa mistura dos materiais liberados
function forcedOrder(route){
  const mix = routeMats(route), mats = Object.keys(mix).sort((a, b) => mix[b] - mix[a]);
  const order = [];
  mats.forEach((m, i) => { order.push(m); if (i === 1) order.push('rej'); });
  if (mats.length >= 2) order.push('misto');
  if (!order.includes('rej')) order.push('rej');
  return order;
}
function startTrip(routeId){
  if (busy || G_mode !== 'base') return;
  const route = routeById(routeId) || ROUTES[0];
  S.route = route.id;
  let total = Math.round(route.items * (1 + 0.15 * nI('conhecimento')));
  if (route.id === 'feira' && evOn('feira2')) total *= 2;
  const space = Math.floor(mixedSpace());
  if (space < 1) { toast(null, FULL_MSG, 'bad', 3500, 'full'); return; }
  trip = {route, items:[], cart:{}, cartKg:0, cap:Math.min(tripCap(), space), fullCap:tripCap(), time:tripTime(), left:tripTime(), elapsed:0, total, spawned:0,
          got:0, rejN:0, drag:null, flying:[], helpers:[], lastSec:99, ended:false, cartRect:{x:140, y:60, w:46, h:40},
          tut:!S.tut.done && S.st.trips === 0, bend:0, vols:[], lastRej:-1};
  if (route.id === 'feira' && evOn('feira2')) S.flags.feiraDia = 1;
  const first = Math.min(total, 9), order = forcedOrder(route);
  while (trip.spawned < first) makeStreetItem(route, order.shift());
  trip.order = order;
  // parcerias: volumes grandes e limpos, já esperando perto do carrinho
  partnersOn().forEach((pa, i) => {
    const kg = Math.round(pa.share * trip.fullCap * (0.85 + Math.random() * 0.3) * 10) / 10, parts = {};
    pa.m.forEach(m => { if (m === 'filme' || matOn(m)) parts[m] = kg / pa.m.length; });
    const main = pa.m.includes('lata') && i % 2 ? 'lata' : pa.m.includes('pet') && i % 3 === 1 ? 'pet' : 'papelao';
    const it = {kind:'vol', vid:'parceiro', kg, parts, partner:1, spr:partnerSprite(main), name:`${pa.n}: material separado (sem rejeito)`,
      x:96 + (i % 2) * 18, y:76 + Math.floor(i / 2) * 16 + (i % 2) * 6, state:'ground', id:Math.random(), rot:0, flip:false};
    trip.items.push(it);
  });
  for (let i = 0; i < nI('ajudante'); i++) trip.helpers.push({x:128 - i * 9, y:72 + i * 7, target:null, cool:1 + i * 0.7, look:personLook(300 + i)});
  AU.sfx('go');
  transition(() => { setSceneMode('street'); updateStreetHud(); });
}
function cartAdd(it){
  if (trip.ended) return false;
  if (trip.cartKg + it.kg > trip.cap + 0.001) {
    AU.sfx('full');
    floatText('Não cabe!', it.x, it.y - 12, 'bad', true);
    if (trip.cartKg >= trip.cap * 0.9) { S.flags.cheio = 1; toast('Carrinho cheio!', 'Volte à base para descarregar.', 'good', 3000, 'cheio'); }
    return false;
  }
  const parts = it.kind === 'rej' ? {rej:it.kg} : it.parts;
  const scale = it.kg / Object.values(parts).reduce((a, v) => a + v, 0);
  const vol = {v:it.kind === 'rej' ? 'rej' : it.vid, p:{}, r:it.r};
  for (const m in parts) { const kg = parts[m] * scale; trip.cart[m] = (trip.cart[m] || 0) + kg; vol.p[m] = kg; }
  trip.vols.push(vol); trip.cartKg += it.kg;
  trip.bend = 0.35;
  const cx = trip.cartRect.x + trip.cartRect.w / 2, cy = trip.cartRect.y + 6;
  spawnFx('street', cx, cy, 'dust', 4);
  if (it.kind === 'rej') {
    trip.rejN++;
    AU.sfx('rej');
    floatText('Não reciclável', cx, trip.cartRect.y, 'bad', true);
    toast(null, '🚫 ' + REJ[it.r].ops, 'bad', 4500); TQ.length && (TQ[TQ.length - 1].street = 1);
  } else {
    trip.got++;
    AU.sfx('pick');
    floatText('+' + fmtKg(it.kg), cx, trip.cartRect.y, 'kg', true);
  }
  if (trip.cartKg >= trip.cap * 0.97) { S.flags.cheio = 1; if (trip.left >= 8) S.flags.cheioRapido = 1; toast('Carrinho cheio!', 'Ótimo trabalho! Volte à base para descarregar.', 'good', 3500, 'cheio'); AU.sfx('full'); }
  updateStreetHud();
  return true;
}
function flyToCart(it){
  it.state = 'fly'; it.fx = it.x; it.fy = it.y; it.ft = 0;
  trip.flying.push(it);
}
function updateStreet(dt){
  if (!trip) return;
  trip.bend = Math.max(0, trip.bend - dt);
  if (!trip.ended && !busy) {
    trip.left -= dt; trip.elapsed += dt;
    const sec = Math.ceil(trip.left);
    if (sec <= 10 && sec !== trip.lastSec && sec > 0) { AU.sfx('tick'); trip.lastSec = sec; }
    if (trip.left <= 0) { trip.left = 0; endTrip(true); }
  }
  const ground = trip.items.filter(i => i.state === 'ground').length;
  if (trip.spawned < trip.total && ground < 10) {
    const interval = trip.time * 0.7 / Math.max(1, trip.total - 9);
    trip.spawnT = (trip.spawnT || 0) + dt;
    if (trip.spawnT > interval) { trip.spawnT = 0; makeStreetItem(trip.route, trip.order && trip.order.shift()); }
  }
  for (const it of trip.flying) {
    it.ft += dt * 3;
    const cx = trip.cartRect.x + trip.cartRect.w / 2, cy = trip.cartRect.y + 10;
    it.x = it.fx + (cx - it.fx) * it.ft; it.y = it.fy + (cy - it.fy) * it.ft - Math.sin(it.ft * Math.PI) * 18;
    if (it.ft >= 1) {
      if (cartAdd(it)) it.state = 'gone';
      else { it.state = 'ground'; it.x = it.fx; it.y = it.fy; }
    }
  }
  trip.flying = trip.flying.filter(i => i.state === 'fly');
  trip.items = trip.items.filter(i => i.state !== 'gone');
  for (const h of trip.helpers) {
    if (trip.ended) break;
    if (!h.target) {
      h.cool -= dt;
      if (h.cool <= 0) {
        const free = trip.cap - trip.cartKg;
        const cand = trip.items.filter(i => i.state === 'ground' && i.kind === 'vol' && !(i.parts && i.parts.rej) && i.kg <= free && !trip.helpers.some(o => o.target === i) && trip.drag?.it !== i);
        if (cand.length) { cand.sort((a, b) => Math.hypot(a.x - h.x, a.y - h.y) - Math.hypot(b.x - h.x, b.y - h.y)); h.target = cand[0]; }
        else h.cool = 1;
      }
    } else {
      const it = h.target;
      if (it.state !== 'ground') { h.target = null; continue; }
      const dx = it.x - h.x, dy = it.y - h.y, d = Math.hypot(dx, dy), sp = 45 * dt;
      if (d < 3) { h.pick = 0.3; flyToCart(it); spawnFx('street', it.x, it.y, 'dust', 3); h.target = null; h.cool = Math.max(1.2, 5 - nI('ajudante') * 0.6); }
      else { h.x += dx / d * Math.min(sp, d); h.y += dy / d * Math.min(sp, d); h.flip = dx < 0; if (Math.random() < 0.05) spawnFx('street', h.x, h.y + 4, 'dust'); }
    }
    h.pick = Math.max(0, (h.pick || 0) - dt);
  }
}
function updateStreetHud(){
  if (!trip) return;
  const s = Math.ceil(trip.left);
  $('timer').textContent = '⏱ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('timer').classList.toggle('warn', s <= 10);
  const nh = nI('ajudante'), capTxt = nh ? ` (${playerCap()} + ${nh}×${helperCap()})` : '';
  $('cartTxt').textContent = `${trip.route.n} · ${fmtNum(trip.cartKg, 1)} / ${fmtNum(trip.cap)} kg${trip.cap < trip.fullCap ? ' (estoque quase cheio)' : capTxt}`;
  const f = Math.min(1, trip.cartKg / trip.cap);
  $('cartFill').style.width = (f * 100) + '%';
  $('cartFill').classList.toggle('full', f >= 0.97);
}
function endTrip(timeout){
  if (!trip || trip.ended) return;
  trip.ended = true;
  if (trip.drag) { trip.drag.it.state = 'ground'; trip.drag = null; }
  for (const it of trip.flying) { cartAdd(it); it.state = 'gone'; }
  if (timeout) { AU.sfx('end'); floatText('Tempo esgotado!', SW / 2, SH / 2, 'bad', true); }
  const t = trip;
  setTimeout(() => {
    let matKg = 0; t.unloaded = true;
    const room = Math.max(0, caps().mixed - sum(S.mixed)), f = t.cartKg > room ? room / t.cartKg : 1; // nunca passa do limite
    for (const k in t.cart) { S.mixed[k] = (S.mixed[k] || 0) + t.cart[k] * f; if (k !== 'rej') matKg += t.cart[k]; }
    S.st.trips++; S.st.streetKg += t.cartKg; S.st.rejStreet += (t.cart.rej || 0);
    if (matKg >= 10 && !(t.cart.rej > 0)) { S.flags.limpa = 1; S.st.cleanTrips++; }
    S.vols.push(...t.vols); if (S.vols.length > 60) S.vols.splice(0, S.vols.length - 60);
    transition(() => { trip = null; for (let i = TQ.length - 1; i >= 0; i--) if (TQ[i].street) TQ.splice(i, 1); setSceneMode('base'); showTripSummary(t); save(); });
  }, timeout ? 900 : 150);
}
function showTripSummary(t){
  const rows = MAT_IDS.filter(m => t.cart[m] > 0).map(m => `<tr><td><span class="sw" style="background:${MATS[m].c}"></span> ${MATS[m].n}</td><td>${fmtKg(t.cart[m])}</td></tr>`).join('');
  let est = 0; MAT_IDS.forEach(m => { if (t.cart[m]) est += t.cart[m] * price(m, 'sep'); });
  const rej = t.cart.rej || 0;
  const rejLine = rej > 0
    ? `<p style="color:var(--red)"><b>Rejeito trazido por engano: ${fmtKg(rej)}</b> (${t.rejN} ${t.rejN === 1 ? 'item' : 'itens'}). Ele não é reciclável: só ocupou espaço e vai ser descartado na triagem.</p>`
    : (t.cartKg >= 10 ? `<p style="color:var(--green)"><b>Nenhum rejeito! Saída limpa. ✨</b></p>` : '');
  showModal('Resumo da saída', `
    <p class="muted">${t.route.n}</p>
    <table class="sumTable">${rows || '<tr><td>Nenhum material reciclável</td><td>–</td></tr>'}
    <tr><td><b>Total no carrinho</b></td><td>${fmtKg(t.cartKg)} de ${fmtKg(t.cap)}</td></tr></table>
    ${rejLine}
    <p>O material chegou <b>misturado</b>. Depois de triado, vale cerca de <b>${fmtMoney(est)}</b>.</p>`,
    [{t:'Continuar'}]);

// ---------- ponteiro (rua e triagem usam a mesma grade 192x108)
function smallPt(e){
  const r = cv.getBoundingClientRect(), w = G_mode === 'sort' ? SL.w : SW, h = G_mode === 'sort' ? SL.h : SH;
  return {x:(e.clientX - r.left) / r.width * w, y:(e.clientY - r.top) / r.height * h};
}
function itemAt(list, p, states){
  let best = null, bd = 13;
  for (const it of list) {
    if (!states.includes(it.state)) continue;
    const d = Math.hypot(it.x - p.x, it.y - it.spr.height / 2 - p.y);
    if (d < bd) { bd = d; best = it; }
  }
  return best;
}
function inCart(p, pad){
  const c = trip.cartRect; pad = pad || 6;
  return p.x > c.x - pad && p.x < c.x + c.w + pad && p.y > c.y - pad - 6 && p.y < c.y + c.h + pad;
}
function showItemTip(it, p){
  const tip = $('itemTip');
  if (!it) { tip.classList.add('hidden'); return; }
  tip.textContent = it.kind === 'rej' || it.m === 'rej' ? `${it.name} · não reciclável` : `${it.name}${it.pack && !it.name.includes('embalagem') ? ' (embalagem)' : ''} · ${fmtKg(it.kg)}`;
  const w = G_mode === 'sort' ? SL.w : SW, h = G_mode === 'sort' ? SL.h : SH;
  tip.style.left = (p.x / w * 100) + '%'; tip.style.top = (p.y / h * 100) + '%';
  tip.classList.remove('hidden');
}
cv.addEventListener('pointerdown', e => {
  AU.init();
  if (busy) return;
  if (G_mode === 'sort') return sortPointerDown(e);
  if (G_mode !== 'street' || !trip || trip.ended) return;
  const p = smallPt(e), it = itemAt(trip.items, p, ['ground']);
  if (!it) return;
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  trip.drag = {it, ox:it.x - p.x, oy:it.y - p.y, sx:p.x, sy:p.y, moved:0, pid:e.pointerId};
  it.state = 'drag';
  $('sceneWrap').classList.add('dragging');
  AU.sfx('grab'); spawnFx('street', it.x, it.y, 'dust', 3);
  showItemTip(it, {x:it.x, y:it.y - it.spr.height - 2});
});
cv.addEventListener('pointermove', e => {
  if (G_mode === 'sort') return sortPointerMove(e);
  if (G_mode !== 'street' || !trip) return;
  const p = smallPt(e);
  if (trip.drag && trip.drag.pid === e.pointerId) {
    const d = trip.drag, ox = d.it.x, oy = d.it.y;
    d.it.x = Math.max(4, Math.min(SW - 4, p.x + d.ox)); d.it.y = Math.max(58, Math.min(SH - 2, p.y + d.oy));
    d.moved = Math.max(d.moved, Math.hypot(p.x - d.sx, p.y - d.sy));
    if (Math.hypot(d.it.x - ox, d.it.y - oy) > 2 && Math.random() < 0.4) spawnFx('street', d.it.x, d.it.y + 2, 'dust');
    showItemTip(d.it, {x:d.it.x, y:d.it.y - d.it.spr.height - 2});
  } else if (e.pointerType === 'mouse') {
    const it = itemAt(trip.items, p, ['ground']); showItemTip(it, it ? {x:it.x, y:it.y - it.spr.height - 2} : p);
  }
});
function dragEnd(e){
  if (G_mode === 'sort') return sortPointerUp(e);
  if (!trip || !trip.drag || trip.drag.pid !== e.pointerId) return;
  const d = trip.drag, it = d.it, p = smallPt(e);
  trip.drag = null; $('sceneWrap').classList.remove('dragging');
  $('itemTip').classList.add('hidden');
  if (trip.ended) { it.state = 'ground'; return; }
  const tap = d.moved < 4;
  if (tap && has('luvas_coleta')) { it.x = d.sx + d.ox; it.y = d.sy + d.oy; flyToCart(it); return; }
  if (inCart(p, has('luvas_coleta') ? 10 : 6) || inCart({x:it.x, y:it.y - 4}, 4)) {
    it.fx = it.x; it.fy = it.y;
    if (cartAdd(it)) it.state = 'gone';
    else { it.state = 'ground'; it.x = Math.min(it.x, trip.cartRect.x - 12); }
  } else {
    it.state = 'ground'; AU.sfx('drop'); spawnFx('street', it.x, it.y, 'dust', 5);
    if (tap && !has('luvas_coleta')) toast(null, 'Arraste o material até o carrinho. Com <b>luvas de coleta</b> basta tocar.', '', 3000, 'arraste');
  }
}
cv.addEventListener('pointerup', dragEnd);

const MAT_TIPO = {papelao:'papel', papel:'papel', pet:'plástico', filme:'plástico', plastico:'plástico', lata:'metal', sucata:'metal', vidro:'vidro'};
const VOL_DEF = {}; Object.values(VOLS).forEach(a => a.forEach(d => VOL_DEF[d.id] = d)); VOL_DEF[MIX_VOL.id] = MIX_VOL;
const PLURAL = {papelao:'Papelão', papel:'Papel e jornal', pet:'Garrafas PET', filme:'Sacos plásticos', lata:'Latinhas', plastico:'Plástico duro',
  vidro:'Garrafas de vidro', sucata:'Sucata de metal'};
// abre os volumes trazidos da rua e agrupa o que tem dentro (conteúdo, embalagem e rejeito)
function takeSortVolumes(){
  const tot = sum(S.mixed); if (tot <= 0.05) return null;
  let target = Math.min(tot, sortBatchKg());
  const matShare = (tot - (S.mixed.rej || 0)) / tot, space = sepSpace();
  let over = 1.15;
  if (target * matShare > space) { if (space <= 0.5) return {full:true}; target = space / Math.max(matShare, 1e-6); over = 1; }
  const groups = {}, opened = []; let took = 0;
  const add = (key, m, kg, extra) => { const g = groups[key] || (groups[key] = Object.assign({m, kg:0}, extra)); g.kg += kg; };
  while (S.vols.length && took < target) {
    const v = S.vols[0];
    let vk = 0; for (const m in v.p) vk += Math.min(v.p[m], S.mixed[m] || 0);
    if (vk < 0.05) { S.vols.shift(); continue; }
    if (took > 0 && took + vk > target * over) break;
    // no máximo 8 tipos diferentes por rodada: o resto fica para o próximo lote
    const pk0 = v.v === 'rej' ? null : (VOL_DEF[v.v] || {}).pack;
    const newKeys = Object.keys(v.p).map(m => m === 'rej' ? 'rej' + v.r : m === pk0 ? 'pack_' + m : m).filter(k => !groups[k]);
    if (opened.length && Object.keys(groups).length + new Set(newKeys).size > 8) break;
    S.vols.shift(); opened.push(v);
    const packM = v.v === 'rej' ? null : (VOL_DEF[v.v] || {}).pack;
    for (const m in v.p) {
      const kg = Math.min(v.p[m], S.mixed[m] || 0); if (kg <= 0) continue;
      S.mixed[m] -= kg; if (S.mixed[m] < 1e-6) delete S.mixed[m];
      took += kg;
      if (m === 'rej') { const r = v.r != null ? v.r : Math.floor(Math.random() * REJ.length); add('rej' + r, 'rej', kg, {r}); }
      else if (m === packM) add('pack_' + m, m, kg, {pack:true});
      else add(m, m, kg, {});
    }
  }
  if (!opened.length && took < target - 0.05) { // material sem volume (coletores, doações)
    const out = takeProp(S.mixed, Object.keys(S.mixed), target - took);
    for (const m in out) { took += out[m]; if (m === 'rej') { const r = Math.floor(Math.random() * REJ.length); add('rej' + r, 'rej', out[m], {r}); } else add(m, m, out[m], {}); }
  }
  return {groups:Object.values(groups), opened};
}
function startSort(){
  if (busy || G_mode !== 'base') return;
  AU.init();
  const b = takeSortVolumes();
  if (!b) { toast(null, 'Não há material misturado para triar. Vá para a rua!', '', 2500, 'nomix'); return; }
  if (b.full) { AU.sfx('deny'); toast('Estoque de separado cheio!', 'Venda o material ou compre bags e baias para ganhar espaço.', 'bad', 3500, 'sepfull'); return; }
  let autoKg = 0;
  let gs = [];
  for (const g of b.groups) {
    if (g.kg <= 0.01) continue;
    if (AUTO_SORTED.includes(g.m)) { sortItem(g.m, g.kg, true); autoKg += g.kg; continue; } // óleo e eletrônicos já vêm separados
    gs.push(g);
  }
  // de 6 a 8 itens por rodada, não importa quantos kg: o peso é dividido entre eles
  while (gs.length > 8) {
    const pk = gs.find(g => g.pack && gs.some(o => o !== g && !o.pack && o.m === g.m));
    if (pk) { gs.find(o => o !== pk && !o.pack && o.m === pk.m).kg += pk.kg; gs.splice(gs.indexOf(pk), 1); continue; }
    gs.sort((a, c) => a.kg - c.kg);
    const small = gs.shift(); sortItem(small.m, small.kg, true); if (small.m !== 'rej') autoKg += small.kg;
  }

function canvasPtToPage(lx, ly, small){
  const r = cv.getBoundingClientRect();
  const w = small === 'sort' ? SL.w : small ? SW : W, h = small === 'sort' ? SL.h : small ? SH : H;
  return {x:r.left + lx / w * r.width, y:r.top + ly / h * r.height};
}
function elRect(e){
  if (!e || e.offsetParent === null) return null;
  const r = e.getBoundingClientRect(); if (!r.width && !r.height) return null;
  return {l:r.left, t:r.top, r:r.right, b:r.bottom};
}
function itemRect(it, dims){
  const a = canvasPtToPage(it.x - it.spr.width / 2 - 2, it.y - it.spr.height - 3, dims), b = canvasPtToPage(it.x + it.spr.width / 2 + 2, it.y + 2, dims);
  return {l:a.x, t:a.y, r:b.x, b:b.y};
}

function smallRect(x, y, w, h, dims){ const a = canvasPtToPage(x, y, dims), b = canvasPtToPage(x + w, y + h, dims); return {l:a.x, t:a.y, r:b.x, b:b.y}; }

function binsPageRect(){ return smallRect(BIN_X(0) - 3, SL.binY - 10, BIN_X(BINS.length - 1) + SL.binW + 6 - BIN_X(0), SL.binH + 10, 'sort'); }

  if (trip.drag) return {txt:(prefix || '') + 'Isso! Agora <b>solte o volume no carrinho</b>.', rect:cartPageRect(), avoid:[itemRect(trip.drag.it, true)]};

  }
  if (it && trip.cartKg < trip.cap * 0.9) return {txt:(prefix || '') + dragTxt, it, dims:true, avoid:[cartPageRect()]};
  return {txt:'Carrinho bom! Toque em <b>Voltar à base</b>.', el:$('btnBack')};

function sortGuide(){
  if (!sortG || sortG.ended || sortG.intro.t < 1) return null;

  const items = sortG.items.filter(i => i.state === 'table' || i.state === 'drag').map(i => itemRect(i, 'sort'));

}

const TUT_IDX = id => TUT.findIndex(s => s.id === id);
let tutState = {idx:-1, t0:0};
function restartTutorial(){

// o balão nunca cobre o alvo nem o destino (carrinho, lixeiras); na rua e na mesa ele prefere a parte de cima do cenário
function placeBubble(bub, r, avoid){
  const vw = window.innerWidth, vh = window.innerHeight, bw = bub.offsetWidth, bh = bub.offsetHeight, m = 12, pad = 6;
  const clampX = x => Math.max(pad, Math.min(vw - bw - pad, x));
  const hit = (a, b) => !(a.r <= b.l || a.l >= b.r || a.b <= b.t || a.t >= b.b);
  const box = p => ({l:p.x - 4, t:p.y - 4, r:p.x + bw + 4, b:p.y + bh + 4});
  const fits = p => p.y >= pad && p.y + bh <= vh - pad && !avoid.some(a => hit(box(p), a));
  const cands = [];
  if (G_mode !== 'base') {
    const c = cv.getBoundingClientRect(), hud = (G_mode === 'sort' ? $('sortHud') : $('streetHud')).getBoundingClientRect();
    cands.push({x:c.left + (c.width - bw) / 2, y:hud.bottom + 4});     // dentro do cenário, logo abaixo da barra
    cands.push({x:c.left + (c.width - bw) / 2, y:c.top - bh - m});     // acima do cenário
    cands.push({x:c.left + (c.width - bw) / 2, y:c.bottom + m});       // abaixo do cenário
  }
  if (r) {
    const cx = (r.l + r.r) / 2, cy = (r.t + r.b) / 2;
    cands.push({x:cx - bw / 2, y:r.b + m}, {x:cx - bw / 2, y:r.t - m - bh}, {x:r.r + m, y:cy - bh / 2}, {x:r.l - m - bw, y:cy - bh / 2});
  }
  cands.push({x:(vw - bw) / 2, y:pad}, {x:(vw - bw) / 2, y:vh - bh - pad});
  cands.forEach(p => p.x = clampX(p.x));
  let pos = cands.find(fits);
  if (!pos) { // último recurso: o lugar que menos encosta nas áreas proibidas
    const over = p => avoid.reduce((s, a) => { const b = box(p); return s + Math.max(0, Math.min(a.r, b.r) - Math.max(a.l, b.l)) * Math.max(0, Math.min(a.b, b.b) - Math.max(a.t, b.t)); }, 0);
    pos = cands.map(p => ({x:p.x, y:Math.max(pad, Math.min(vh - bh - pad, p.y))})).sort((a, b) => over(a) - over(b))[0];
  }
  bub.style.left = pos.x + 'px'; bub.style.top = pos.y + 'px';
}
function updateTutorial(){
  const bub = $('tutBubble'), hole = $('tutHole');
  const hide = () => { bub.classList.add('hidden'); hole.classList.add('hidden'); };
  if (S.tut.done || modalOpen() || busy) return hide();
  const step = TUT[S.tut.step];
  if (!step) { S.tut.done = true; toast('🎓 Tutorial concluído!', 'Agora é com você. Bom trabalho!', 'good', 5000); return hide(); }
  if (tutState.idx !== S.tut.step) tutState = {idx:S.tut.step, t0:performance.now()};
  bub.classList.toggle('wide', G_mode !== 'base');
  if (step.done(tutState)) { S.tut.step++; return; }
  if (step.back) { const b = step.back(); if (b) { S.tut.step = TUT_IDX(b); return; } }
  const v = step.view && step.view();
  if (!v || !v.txt) return hide();
  let r = v.rect || (v.it ? itemRect(v.it, v.dims) : v.el ? elRect(v.el) : null);
  // áreas que o jogador precisa ver em cada cenário
  const scene = G_mode === 'street' && trip ? [cartPageRect()] : G_mode === 'sort' && sortG && sortG.intro.t >= 1 ? [binsPageRect(), ...sortG.items.filter(i => i.state === 'table').map(i => itemRect(i, 'sort'))] : [];
  v.avoid = [...(v.avoid || []), ...scene];
  // leva o alvo para dentro da tela (painel, loja, celular)
  if (v.el && r && (r.t < 40 || r.b > window.innerHeight - 10) && tutState.scrolled !== v.el) { tutState.scrolled = v.el; v.el.scrollIntoView({block:'center', behavior:'smooth'}); }
  if (bub.dataset.step !== step.id) {
    bub.dataset.step = step.id; bub.dataset.txt = '';
    bub.innerHTML = `<div class="tt"></div><div class="tb">${step.ok ? '<button class="btn" id="tutOk">Entendi</button>' : ''}<button class="btn alt" id="tutSkip">Pular tutorial</button></div>`;
    $('tutSkip').onclick = () => { S.tut.done = true; S.tut.step = TUT.length; hide(); toast(null, 'Tutorial pulado. Dá para recomeçar em <b>Como jogar</b> (botão ?).', '', 4000); };
    if (step.ok) $('tutOk').onclick = () => { S.tut.step++; };
  }
  bub.classList.toggle('compact', !!v.compact);
  if (bub.dataset.txt !== v.txt) { bub.dataset.txt = v.txt; bub.querySelector('.tt').innerHTML = v.txt; }
  bub.classList.remove('hidden');
  if (r) {
    const p = 6;
    hole.style.left = (r.l - p) + 'px'; hole.style.top = (r.t - p) + 'px'; hole.style.width = (r.r - r.l + p * 2) + 'px'; hole.style.height = (r.b - r.t + p * 2) + 'px';
    hole.classList.remove('hidden');
    const hr = {l:r.l - p, t:r.t - p, r:r.r + p, b:r.b + p};
    placeBubble(bub, hr, [hr, ...(v.avoid || [])]);
  } else { hole.classList.add('hidden'); placeBubble(bub, null, v.avoid || []); }
}

  showModal('Identidade da cooperativa', `
    <div class="coopHead"><span class="rc">♻</span><b>${esc(coopName())}</b></div>
    <p>Com o CNPJ na mão, chegou a hora de criar a <b>identidade da cooperativa</b>: uma logo para a placa do galpão, os uniformes e os caminhões.</p>
    <p class="muted">Monte com formatos, símbolos, cores e letras prontos. Dá para mudar quando quiser, em <b>Mais › Identidade</b>.</p>`,
    [{t:'Depois', cls:'alt', fn:() => { if (!S.coop.logo) { S.coop.logo = randomLogo(); updateCoopHeader(); save(); toast('Logo provisória criada', 'Você pode editar quando quiser em Mais › Identidade.', 'fact', 5000); } }},
     {t:'🎨 Criar a logo', fn:() => openLogoEditor()}]);
}
function openLogoEditor(){
  const L = Object.assign(randomLogo(), S.coop.logo || {});
  if (!L.sigla) L.sigla = makeSigla(coopName());
  const opt = (k, v, label, extra) => `<button class="leOpt" data-k="${k}" data-v="${v}">${extra || ''}<span>${label}</span></button>`;
  const sw = k => LOGO_COLORS.map(c => `<button class="leSw" data-k="${k}" data-v="${c}" style="background:${c}" aria-label="cor ${c}"></button>`).join('');
  const html = `<div class="logoEd">
    <div class="lePrev"><canvas id="lePrev" width="360" height="430"></canvas><div class="muted">Prévia ao vivo</div></div>
    <div class="leOpts">
      <h4>Formato do fundo</h4><div class="leRow">${LOGO_SHAPES.map(([v, n]) => opt('shape', v, n, `<canvas width="56" height="56" data-th="shape" data-v="${v}"></canvas>`)).join('')}</div>
      <h4>Símbolo</h4><div class="leRow">${LOGO_SYMBOLS.map(([v, n]) => opt('symbol', v, n, `<canvas width="56" height="56" data-th="symbol" data-v="${v}"></canvas>`)).join('')}</div>
      <h4>Cor do fundo</h4><div class="leRow">${sw('bg')}</div>
      <h4>Cor do símbolo</h4><div class="leRow">${sw('sym')}</div>
      <h4>Cor do texto</h4><div class="leRow">${sw('txt')}</div>
      <h4>Texto</h4><div class="leRow">${opt('text', 'name', 'Nome completo')}${opt('text', 'sigla', 'Sigla')}
        <input id="leSigla" maxlength="5" value="${esc(L.sigla)}" aria-label="Sigla"></div>
      <h4>Fonte</h4><div class="leRow">${LOGO_FONTS.map((f, i) => opt('font', i, f[1], `<b style="font-family:${f[0].replace(/"/g, "'")};font-weight:${f[2]}">Aa</b>`)).join('')}</div>
    </div></div>`;
  const paint = m => {
    const g = $('lePrev').getContext('2d'); drawFullLogo(g, 360, 430, L, coopName());
    m.querySelectorAll('[data-th]').forEach(c => {
      const t = c.getContext('2d'); t.clearRect(0, 0, 56, 56);
      const tmp = Object.assign({}, L, {text:'name'}); tmp[c.dataset.th] = c.dataset.v;
      if (c.dataset.th === 'shape') { t.save(); t.scale(56, 56); logoShapePath(t, c.dataset.v); t.fillStyle = L.bg; t.fill(); t.restore(); }
      else drawEmblem(t, 2, 2, 52, tmp);
    });
    m.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('on', String(L[b.dataset.k]) === b.dataset.v));
    $('leSigla').disabled = L.text !== 'sigla';
  };
  showModal('🎨 Logo da cooperativa', html, [{t:'Cancelar', cls:'alt'}, {t:'Sorteio 🎲', cls:'blue', keep:true, fn:() => { Object.assign(L, randomLogo(), {text:L.text, sigla:L.sigla, font:L.font}); paint($('modal')); }},
    {t:'Salvar logo', fn:() => {
      L.sigla = ($('leSigla').value || makeSigla(coopName())).toUpperCase().slice(0, 5);
      const first = !S.coop.logo; S.coop.logo = L; updateCoopHeader(); lastSig = ''; save();
      AU.sfx('ach'); toast(first ? 'Logo criada!' : 'Logo atualizada!', 'Ela já aparece na placa, nos uniformes e nos caminhões.', 'good', 4000);
    }}], {wide:true, onShow:m => {
      m.querySelector('.logoEd').addEventListener('click', e => {
        const b = e.target.closest('[data-k]'); if (!b) return;
        const k = b.dataset.k; L[k] = k === 'font' ? +b.dataset.v : b.dataset.v; AU.sfx('click'); paint(m);
      });
      $('leSigla').oninput = e => { L.sigla = e.target.value.toUpperCase().slice(0, 5); e.target.value = L.sigla; paint(m); };
      paint(m);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if ($('lePrev')) paint(m); });
    }});
}

// =====================================================================
// GANCHOS DA LÓGICA
// =====================================================================
HOOK.ach = a => {
  AU.sfx('ach');
  const tier = a.tier ? TIER[a.tier][0] + ' ' : '🏆 ';
  toast(tier + (a.secret ? 'Conquista secreta: ' : 'Conquista: ') + a.n, a.d + ' <b>+1% de produtividade.</b>', 'ach', 5000);
  tipOnce('ach', 'Conquistas', 'São mais de 60 conquistas, e cada uma dá +1% de produtividade para todo mundo. Veja todas na aba Conquistas.');
};
HOOK.canEvent = () => G_mode !== 'sort' && !modalOpen() && !busy;
HOOK.event = ev => {
  AU.sfx(ev.good ? 'event' : 'bad');
  toast((ev.good ? '📣 ' : '⚠ ') + ev.t, ev.d, ev.good ? 'good' : 'bad', 6000);
  const q = TQ.pop(); q.ev = 1; TQ.unshift(q); // o evento aparece logo em seguida, na frente das outras mensagens
  if (ev.id === 'chuva') rainUntil = performance.now() + 8000;
  tipOnce('events', 'Eventos', 'De vez em quando acontece algo na cidade. Os eventos ruins são raros e dá para evitá-los com melhorias, como a lona contra a chuva.');
  lastSig = '';
};

// =====================================================================
// LAÇO PRINCIPAL
// =====================================================================
let lastFrame = performance.now(), acc = 0, incomeHist = [], uiT = 0, autoT = 0;
function catchUp(secs){
  const before = S.money;
  const steps = Math.min(7200, Math.floor(secs));
  for (let i = 0; i < steps; i++) tick(1, true);
  const g = S.money - before;
  if (g > 0.5) toast('Enquanto você estava fora', `A cooperativa ganhou <b>${fmtMoney(g)}</b>.`, 'good', 5000);
}
function render(t){
  if (G_mode === 'street' && trip) { drawStreet(t); return null; }
  if (G_mode === 'sort' && sortG) { drawSort(t); return null; }
  ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.imageSmoothingEnabled = false; CX = ctx;
  ctx.drawImage(buildSky(), 0, 0, W, 90);
  drawSkyLife(t, W, 8, 1);
  const bgOld = buildAnim && buildAnim.oldBg && (performance.now() - buildAnim.t0) < buildAnim.dur * 0.9;
  ctx.drawImage(bgOld ? buildAnim.oldBg : buildBaseBg(), 0, 0, W, H);
  const shown = drawBaseDynamic(t);
  drawBuild(t);
  return shown;
}
function updateHud(shown){
  $('money').textContent = fmtMoney(S.money);
  $('cashLbl').textContent = cashLabel();
  const now = performance.now();
  incomeHist.push([now, S.st.caixaIn || 0]); while (incomeHist.length > 2 && now - incomeHist[0][0] > 10000) incomeHist.shift();
  const [t0, e0] = incomeHist[0]; const rate = now - t0 > 1500 ? ((S.st.caixaIn || 0) - e0) / ((now - t0) / 1000) : 0;
  $('rate').innerHTML = '+' + fmtMoney(Math.max(0, rate)) + '/s' + (shareOn() ? ` · <span title="Renda média por cooperado, no ritmo atual">👥 ${fmtMoney(rendaMes())}/mês</span>` : '');
  $('phaseChip').textContent = window.innerWidth < 600 ? `Fase ${S.phase}/10` : `Fase ${S.phase}/10 · ${PHASES[S.phase - 1].name}`;
  renderGoal();
  if (G_mode === 'street') { updateStreetHud(); return; }
  if (G_mode !== 'base') return;
  const mixT = sum(S.mixed), sv = sellableValue();
  const open = ROUTES.filter(routeOn);
  const full = mixedSpace() < 1;
  $('goSub').textContent = full ? FULL_MSG : open.length > 1 ? 'Escolher rota' : open[0].n;
  $('sortSub').textContent = S.roles.triagem > 0 ? 'automática ✓ · jogar' : fmtKg(mixT) + ' misturado';
  $('sellSub').textContent = sv > 0 ? fmtMoney(sv) : (mixT > 0 ? 'só misturado' : 'nada a vender');
  $('btnSellLbl').textContent = S.roles.venda > 0 ? 'Vender agora' : 'Vender';
  const ap = $('autoPill');
  if (ap) { ap.classList.toggle('hidden', !(S.roles.venda > 0)); ap.classList.toggle('off', !S.autoSell); ap.innerHTML = S.autoSell ? '⚖ Venda automática: <b>ligada</b> <span>⏸</span>' : '⏸ Venda automática: <b>pausada</b> <span>▶</span>'; }
  // botões e rótulos seguem o lugar onde a triagem e a venda acontecem no cenário
  const place = (id, x, y) => { const e = $(id); if (e) { e.style.left = (x / W * 100) + '%'; e.style.top = (y / H * 100) + '%'; } };
  place('hotSort', ZONES.sort.x, ZONES.sort.y); place('hotSell', ZONES.sell.x, ZONES.sell.y);
  // a pílula e o rótulo ficam logo acima do botão, medidos em pixels (no celular o botão ocupa mais do cenário)
  const above = (id, refId) => { const e = $(id), ref = $(refId); if (!e || !ref || e.classList.contains('hidden')) return;
    e.style.left = ref.style.left; e.style.top = (ref.offsetTop - ref.offsetHeight / 2 - e.offsetHeight * (e.classList.contains('badge') ? 0.5 : 1) - 3) + 'px'; }; place('bdg-venda', ZONES.sell.x + 30, 178);
  const hs = $('hotSortKg'); if (hs) hs.textContent = mixT > 0 ? fmtKg(mixT) : '';
  const hl = $('hotSellLbl'); if (hl) hl.textContent = has('balanca') ? 'Vender' : 'Atravessador';
  $('hotSort')?.classList.toggle('pulse', mixT > 0.5 && S.phase <= 3 && S.roles.triagem === 0);
  $('hotSell')?.classList.toggle('pulse', sv > 0.5 && S.phase <= 3);
  $('btnGo').disabled = busy || full;
  if (shown) ROLE_IDS.forEach(r => {
    const b = $('bdg-' + r); if (!b) return;
    const n = S.roles[r];
    if (n > 0 && n > (shown[r] || 0)) { b.textContent = `${ROLES[r].n} x${n}`; b.classList.remove('hidden'); } else b.classList.add('hidden');
  });
  above('autoPill', 'hotSell'); above('bdg-triagem', 'hotSort');
  EQUIP_BADGES.forEach(([id, lb, mx, bx, by]) => {
    const b = $('eq-' + id); if (!b) return;
    // bags e baias mudam de lugar: pátio (fases 1-2), barracão (3-4) e galpão (5+)
    if (id === 'bag' && S.phase >= 3) { [mx, bx, by] = S.phase >= 5 ? [sum(S.pellet) > 0 ? 4 : 6, 200, 104] : [8, 166, 100]; }
    if (id === 'baia' && S.phase >= 5) { [mx, bx, by] = [6, 232, 74]; }
    b.style.left = (bx / W * 100) + '%'; b.style.top = (by / H * 100) + '%';
    const n = equipCount(id), show = n > mx && !(id === 'mesa' && nI('esteira') > 0 && n <= 2);
    if (show) { b.textContent = `${lb} x${n}`; b.classList.remove('hidden'); } else b.classList.add('hidden');
  });
  $('dotLoja').classList.toggle('hidden', !CATS.some(c => catHasBuyable(c.id)));
}
// espaço guardado para o que está no carrinho e na mesa de triagem, para a coleta automática não ocupar
function reserveStock(){
  STOCK_RES.mixed = trip && !trip.unloaded ? trip.cap : 0; STOCK_RES.sep = 0;
  if (sortG) for (const it of sortG.items) if (it.state !== 'gone') { STOCK_RES.mixed += it.kg; if (it.m !== 'rej') STOCK_RES.sep += it.kg; }
}
function frame(now){
  let dt = (now - lastFrame) / 1000; lastFrame = now;
  if (dt > 5) { catchUp(dt); dt = 0; }
  dt = Math.min(dt, 0.25);
  acc += dt;
  reserveStock();
  while (acc >= 0.2) { tick(0.2); acc -= 0.2; }
  if (G_mode === 'street') updateStreet(dt);
  if (G_mode === 'sort') updateSort(dt);
  updateFx(dt);
  autoT += dt;
  if (autoT > 2.5) { autoT = 0; if ((S._autoAcc || 0) > 0.005 && G_mode === 'base' && !busy) floatText('+' + fmtMoney(S._autoAcc), ZONES.sell.x + 18, ZONES.sell.y + 30, 'money small'); S._autoAcc = 0; }
  const shown = render(now / 1000);
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; updateHud(shown); renderPanel(); }
  else if (G_mode === 'street') updateStreetHud();
  pumpToasts(dt);
  updateTutorial();
  if (S.tut.done && !busy) {
    S.nextFact -= dt;
    if (S.nextFact <= 0) {
      S.nextFact = 110 + Math.random() * 70;
      toast('🌱 Você sabia?', FACTS[S.factIdx % FACTS.length], 'fact', 9000); S.factIdx++;
    }
  }
  requestAnimationFrame(frame);
}

// =====================================================================
// INÍCIO
// =====================================================================
function boot(){
  const had = load();
  const off = had ? offlineProgress() : null;
  setupHots();
  $('btnSort').onclick = () => startSort();
  $('btnSell').onclick = () => { AU.init(); doSell(); };
  $('btnGo').onclick = () => { AU.init(); chooseRoute(); };
  $('btnBack').onclick = () => { AU.sfx('click'); endTrip(false); };
  $('btnSortExit').onclick = () => {
    AU.sfx('click');
    if (!sortG) return;
    const left = sortG.items.filter(i => i.state !== 'gone').length;
    if (left === 0) return finishSort(false);
    finishSort(true); toast(null, `Você saiu da mesa. ${left} ${left === 1 ? 'item voltou' : 'itens voltaram'} para o monte de misturado.`, '', 3500);
  };
  updateSoundBtns(); updateCoopHeader();
  $('btnCfg').onclick = () => { AU.init(); AU.sfx('click'); selectTab('mais'); $('panel').scrollIntoView({behavior:'smooth', block:'start'}); };
  document.addEventListener('pointerdown', () => AU.init(), {once:true});
  setInterval(() => { if (!resetting) save(); }, 5000);
  window.addEventListener('beforeunload', () => { if (!resetting) save(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !resetting) save(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastSig = ''; goalSig = ''; });
  renderPanel(true); renderGoal(true);
  if (!had) {
    showModal('Bem-vindo(a) à cooperativa!', `
      <p>Você é um(a) catador(a) e guarda seu carrinho num terreno baldio do bairro.</p>
      <p>Cada garrafa, latinha e caixa de papelão que você recolhe deixa de ir para o lixão e volta para a indústria como matéria-prima. Seu trabalho é <b>essencial</b> para a cidade e para o meio ambiente.</p>
      <p>Com o tempo, outros catadores vão se juntar a você. Juntos, vocês vão transformar este terreno numa grande central de reciclagem.</p>`,
      [{t:'Pular tutorial', cls:'alt', fn:() => { S.tut.done = true; S.tut.step = TUT.length; openNameModal(true); }}, {t:'Começar!', fn:() => openNameModal(true)}]);
  } else if (!S.coop.name) { openNameModal(true);
  } else if (off && (off.money > 0.01 || off.col > 1)) {
    const h = Math.floor(off.secs / 3600), m = Math.floor(off.secs % 3600 / 60);
    showModal('Enquanto você estava fora...', `<p>Você ficou fora por ${h ? h + ' h ' : ''}${m} min${off.secs >= 7200 ? ' (a cooperativa conta até 2 horas)' : ''}. A cooperativa continuou trabalhando:</p>
      <table class="sumTable"><tr><td>Material coletado</td><td>${fmtKg(off.col)}</td></tr><tr><td>Material triado</td><td>${fmtKg(off.sorted)}</td></tr>
      <tr><td>Material vendido</td><td>${fmtKg(off.sold)}</td></tr><tr><td><b>Ganho</b></td><td>${fmtMoney(off.money)}</td></tr></table>${off.sorted < 0.5 && off.col > 0 ? '<p class="muted">O material chegou, mas ninguém fez a triagem. Trie e venda, ou tenha triadores (a partir da fase 3).</p>' : ''}`, [{t:'Ótimo!'}]);
  }
  requestAnimationFrame(t => { lastFrame = t; requestAnimationFrame(frame); });
}
boot();

</script>
</body>
</html>
