<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b2a1e">
<title>Cooperativa: da carroça à central de reciclagem</title>
<style>
:root{
  --bg:#2b2119; --bg2:#3b2a1e; --paper:#f6ecd6; --paper2:#efe0bf; --ink:#3a2a1c; --ink2:#6b5440;
  --green:#3f8f3a; --green2:#62b356; --red:#c2412d; --yellow:#e8b631; --blue:#3a7fc4; --line:#d6c29a;
  --shadow:0 3px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;font-size:15px;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.5}
.hidden{display:none!important}
/* ---------- topo */
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);color:var(--paper);border-bottom:3px solid #1d150f;position:sticky;top:0;z-index:30;flex-wrap:wrap}
#logo{font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:6px;font-size:15px}
#logo .rc{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--green);text-align:center;line-height:22px}
#money{font-weight:800;font-size:18px;color:#ffe08a;font-variant-numeric:tabular-nums}
#rate{font-size:12px;color:#d9c7a3}
#phaseChip{background:#5a4230;border-radius:20px;padding:3px 10px;font-size:12px;white-space:nowrap}
#top .sp{flex:1}
.ibtn{background:#5a4230;color:var(--paper);width:34px;height:34px;font-size:17px;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.ibtn.off{opacity:.45;text-decoration:line-through}
/* ---------- layout */
#app{flex:1;display:flex;gap:10px;padding:10px;align-items:flex-start;max-width:1500px;width:100%;margin:0 auto}
#stage{flex:1;min-width:0;position:sticky;top:58px}
#sceneWrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:3px solid #1d150f;box-shadow:0 6px 0 rgba(0,0,0,.3)}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#sceneWrap.street #cv{touch-action:none;cursor:grab}
#sceneWrap.street.dragging #cv{cursor:grabbing}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floater{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(12px,2.2vw,18px);color:#fff;text-shadow:0 2px 0 #000,0 0 4px #000;animation:floatUp 1.2s ease-out forwards;white-space:nowrap}
.floater.bad{color:#ff9a8a}.floater.money{color:#ffe08a}.floater.kg{color:#bff0b0}
@keyframes floatUp{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-50px}}
.hot{position:absolute;transform:translate(-50%,-50%);background:rgba(255,248,230,.92);color:var(--ink);border:2px solid #3a2a1c;border-radius:10px;padding:4px 9px;font-weight:800;font-size:clamp(11px,1.8vw,15px);box-shadow:0 3px 0 rgba(0,0,0,.35);display:flex;align-items:center;gap:5px;white-space:nowrap}
.hot small{font-weight:600;font-size:.8em;color:var(--ink2)}
.hot.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
.badge{position:absolute;transform:translate(-50%,-50%);background:rgba(30,20,12,.8);color:#fff;font-size:clamp(9px,1.4vw,12px);font-weight:700;padding:1px 5px;border-radius:6px;pointer-events:none}
/* rua HUD */
#streetHud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:6px;align-items:center;pointer-events:none}
#streetHud>*{pointer-events:auto}
#timer{background:rgba(30,20,12,.85);color:#fff;font-weight:800;border-radius:8px;padding:4px 10px;font-size:clamp(14px,2.6vw,22px);font-variant-numeric:tabular-nums}
#timer.warn{background:var(--red);animation:pulse2 .5s infinite}
@keyframes pulse2{50%{transform:scale(1.1)}}
#cartBox{flex:1;background:rgba(30,20,12,.85);border-radius:8px;padding:4px 8px;color:#fff;font-size:clamp(11px,1.8vw,14px);max-width:330px}
#cartBar{height:8px;background:#5a4a3a;border-radius:5px;overflow:hidden;margin-top:3px}
#cartFill{height:100%;background:var(--green2);width:0;transition:width .2s}
#cartFill.full{background:var(--yellow)}
#routeName{color:#fff;background:rgba(30,20,12,.7);border-radius:8px;padding:4px 8px;font-size:12px}
#btnBack{margin-left:auto;background:var(--yellow);color:var(--ink);font-weight:800;padding:7px 12px;box-shadow:var(--shadow)}
#itemTip{position:absolute;transform:translate(-50%,-130%);background:rgba(30,20,12,.9);color:#fff;font-size:12px;padding:2px 7px;border-radius:6px;pointer-events:none;white-space:nowrap}
/* barra de ações */
#actionBar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.big{flex:1;min-width:120px;padding:12px 10px;font-weight:800;font-size:16px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35);border-radius:10px}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.b-go{background:var(--blue)}.b-sort{background:#8a5a2b}.b-sell{background:var(--green)}
.big small{display:block;font-weight:600;font-size:11px;opacity:.9}
#tipBox{margin-top:10px;background:rgba(246,236,214,.08);border:1px dashed #6b5440;color:#e8d8b8;border-radius:10px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
#tipBox b{color:#ffe08a}
/* ---------- painel */
#panel{width:400px;flex-shrink:0;background:var(--paper);border-radius:12px;border:3px solid #1d150f;box-shadow:0 6px 0 rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
#tabs{display:flex;background:var(--paper2);border-bottom:2px solid var(--line)}
.tab{flex:1;background:none;padding:10px 4px;font-weight:700;color:var(--ink2);position:relative;border-radius:0;font-size:14px}
.tab.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 -3px 0 var(--green)}
.dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--paper)}
#tabBody{overflow-y:auto;padding:12px;flex:1;-webkit-overflow-scrolling:touch}
h3{margin:4px 0 8px;font-size:16px}
h4{margin:12px 0 6px;font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.card{background:#fffaf0;border:2px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.pbar{height:12px;background:#e3d3b0;border-radius:7px;overflow:hidden;border:1px solid #c9b48a}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));transition:width .3s}
.pbar.warn>div{background:linear-gradient(90deg,#d9822b,#e8b631)}
.pbar.full>div{background:linear-gradient(90deg,#b8321f,#d9532e)}
.req{display:flex;gap:6px;font-size:13px;padding:3px 0;align-items:flex-start}
.req .ok{color:var(--green);font-weight:800}.req .no{color:var(--red);font-weight:800}
.req span.v{margin-left:auto;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{background:var(--green);color:#fff;font-weight:700;padding:8px 12px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.alt{background:#8a6a4a}.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.wide{width:100%;margin-top:8px;padding:10px}
.stockRow{margin-bottom:10px}
.stockHead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11px;background:#f1e5c9;border-radius:10px;padding:2px 7px;display:flex;align-items:center;gap:4px}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.row{display:flex;gap:6px;align-items:center}
.warnTxt{color:var(--red);font-size:12px;font-weight:700;margin-top:3px}
.muted{color:var(--ink2);font-size:12px}
table.prices{width:100%;border-collapse:collapse;font-size:12px}
table.prices td,table.prices th{padding:3px 4px;border-bottom:1px solid #eadcb9;text-align:right}
table.prices td:first-child,table.prices th:first-child{text-align:left}
/* loja */
#cats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat{background:var(--paper2);color:var(--ink2);font-weight:700;font-size:12px;padding:6px 9px;position:relative;border:2px solid transparent}
.cat.on{background:#fff;border-color:var(--green);color:var(--ink)}
.cat .dot{top:-3px;right:-3px}
.item{display:flex;gap:10px}
.item .ic{width:40px;height:40px;flex-shrink:0;background:#f1e5c9;border-radius:8px;image-rendering:pixelated}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:14px}
.item .ds{font-size:12px;color:var(--ink2);margin:2px 0 6px}
.item .cnt{font-size:11px;background:#e8dcc0;border-radius:8px;padding:1px 6px;margin-left:4px;font-weight:700;color:var(--ink2)}
.buyRow{display:flex;gap:4px;flex-wrap:wrap}
.buyRow .btn{padding:6px 7px;font-size:12px;flex:1;min-width:60px;line-height:1.15}
.buyRow .btn small{display:block;font-weight:600;font-size:10.5px;opacity:.95}
.item.locked{opacity:.75}.item.locked .ic{filter:grayscale(1) brightness(.8)}
.lockMsg{font-size:12px;color:#8a4a2a;font-weight:700}
.limitMsg{font-size:12px;color:#8a5a00;font-weight:700;background:#fff1c9;border-radius:6px;padding:4px 6px}
.item.mystery .nm{letter-spacing:3px}
details.done{margin-top:10px}
details.done summary{cursor:pointer;font-weight:700;color:var(--ink2);padding:6px 0}
.doneItem{font-size:12px;padding:3px 0;color:var(--ink2);border-bottom:1px dashed #e3d3b0}
.roleRow{display:flex;gap:8px;align-items:flex-start}
.roleRow .rn{font-weight:800}
.roleRow .cnt2{margin-left:auto;font-weight:800;font-size:15px;white-space:nowrap}
.moveBtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.moveBtns .btn{font-size:11px;padding:4px 7px}
/* conquistas */
.achGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{background:#fffaf0;border:2px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
.ach.on{border-color:#e8b631;background:#fff6d8}
.ach .an{font-weight:800;font-size:13px;margin-bottom:2px}
.ach.off{opacity:.7}
/* toasts */
#toasts{position:fixed;right:10px;top:60px;z-index:60;display:flex;flex-direction:column;gap:6px;width:min(340px,calc(100vw - 20px));pointer-events:none}
.toast{background:var(--paper);border:3px solid #1d150f;border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:tin .3s ease-out;pointer-events:auto}
.toast b{display:block;font-size:14px;margin-bottom:1px}
.toast.good{border-color:var(--green)}.toast.bad{border-color:var(--red)}.toast.ach{border-color:#e8b631;background:#fff6d8}.toast.fact{border-color:var(--blue);background:#eaf3fb}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
@keyframes tout{to{transform:translateX(30px);opacity:0}}
/* modal */
#modalBg{position:fixed;inset:0;background:rgba(15,10,5,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px}
#modal{background:var(--paper);border:3px solid #1d150f;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#modal h2{margin:0 0 8px;font-size:20px}
#modal p{margin:6px 0;line-height:1.4}
#modal ul{margin:6px 0;padding-left:20px;line-height:1.5}
.mBtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mBtns .btn{flex:1;padding:11px}
.routeCard{display:flex;gap:10px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fffaf0;width:100%;text-align:left;color:var(--ink)}
.routeCard:not(:disabled):hover{border-color:var(--blue)}
.routeCard .rnm{font-weight:800}
.routeCard canvas{width:72px;height:40px;border-radius:6px;image-rendering:pixelated;flex-shrink:0}
.sumTable{width:100%;border-collapse:collapse;margin:6px 0}
.sumTable td{padding:4px;border-bottom:1px solid #eadcb9}.sumTable td:last-child{text-align:right;font-weight:700}
.roleChoice{display:block;width:100%;text-align:left;background:#fffaf0;border:2px solid var(--line);padding:10px;margin-bottom:8px;color:var(--ink)}
.roleChoice:not(:disabled):hover{border-color:var(--green)}
/* tutorial */
#tutBubble{position:fixed;z-index:70;max-width:300px;background:#fffbe8;border:3px solid #e8b631;border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 6px 0 rgba(0,0,0,.3);line-height:1.35}
#tutBubble .tb{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
#tutBubble .tb button{font-size:12px;padding:5px 9px}
#tutArrow{position:fixed;z-index:71;font-size:34px;pointer-events:none;color:#e8b631;text-shadow:0 2px 0 #000;animation:bob .7s infinite;transform:translate(-50%,-100%)}
@keyframes bob{50%{margin-top:-10px}}
#buildOverlay{position:absolute;inset:0;pointer-events:none}
/* responsivo */
@media (max-width:900px){
  #app{flex-direction:column;padding:8px;gap:8px}
  #stage{position:relative;top:0;width:100%}
  #panel{width:100%;max-height:none}
  #tabBody{overflow:visible}
  #logo .txt{display:none}
  #top{flex-wrap:nowrap;gap:6px;padding:6px 8px}
  .ibtn{width:30px;height:30px;font-size:15px}
  #phaseChip{max-width:34vw;overflow:hidden;text-overflow:ellipsis}
  #toasts{top:auto;bottom:10px;right:8px}
  .toast{font-size:12px;padding:6px 8px}
  body.inStreet #panel,body.inStreet #tipBox{display:none}
  .big{min-width:90px;font-size:15px;padding:10px 6px}
}
@media (max-width:420px){ .achGrid{grid-template-columns:1fr} #money{font-size:16px} }
</style>
</head>
<body>
<header id="top">
  <div id="logo"><span class="rc">♻</span><span class="txt">Cooperativa</span></div>
  <div><div id="money">R$ 0,00</div><div id="rate">+R$ 0,00/s</div></div>
  <div id="phaseChip">Fase 1</div>
  <div class="sp"></div>
  <button class="ibtn" id="btnMusic" title="Música" aria-label="Ligar ou desligar música">♪</button>
  <button class="ibtn" id="btnSfx" title="Efeitos sonoros" aria-label="Ligar ou desligar efeitos">🔊</button>
  <button class="ibtn" id="btnHelp" title="Como jogar" aria-label="Como jogar">?</button>
</header>
<div id="app">
  <section id="stage">
    <div id="sceneWrap">
      <canvas id="cv"></canvas>
      <div id="hots"></div>
      <div id="floaters"></div>
      <div id="streetHud" class="hidden">
        <div id="timer">0:45</div>
        <div id="cartBox"><span id="cartTxt">0 / 25 kg</span><div id="cartBar"><div id="cartFill"></div></div></div>
        <button id="btnBack">Voltar à base</button>
      </div>
      <div id="itemTip" class="hidden"></div>
      <div id="fade"></div>
    </div>
    <div id="actionBar">
      <button class="big b-go" id="btnGo">🛒 Ir para a rua<small id="goSub">Rua do bairro</small></button>
      <button class="big b-sort" id="btnSort">✋ Triar<small id="sortSub">0 kg misturado</small></button>
      <button class="big b-sell" id="btnSell">⚖ Vender<small id="sellSub">R$ 0,00</small></button>
    </div>
    <div id="tipBox"><span>💡</span><div id="tipTxt"></div></div>
  </section>
  <aside id="panel">
    <nav id="tabs">
      <button class="tab on" data-tab="coop" id="tab-coop">Cooperativa</button>
      <button class="tab" data-tab="loja" id="tab-loja">Loja<span class="dot hidden" id="dotLoja"></span></button>
      <button class="tab" data-tab="ach" id="tab-ach">Conquistas</button>
      <button class="tab" data-tab="mais" id="tab-mais">Mais</button>
    </nav>
    <div id="tabBody"></div>
  </aside>
</div>
<div id="toasts"></div>
<div id="modalBg" class="hidden"><div id="modal"></div></div>
<div id="tutBubble" class="hidden"></div>
<div id="tutArrow" class="hidden">▼</div>
<script>
/*LOGIC-START*/
'use strict';
// =====================================================================
// CONFIGURAÇÃO
// =====================================================================
const MATS = {
  papelao:  {n:'Papelão',         c:'#b8864b', atr:0.40, ind:0.60, w:[2,4],     bale:1},
  pet:      {n:'Garrafa PET',     c:'#62c0ea', atr:1.60, ind:2.40, w:[1,2],     bale:1, pellet:1},
  lata:     {n:'Latinha',         c:'#c9ccd4', atr:4.50, ind:6.50, w:[0.5,1.2], bale:1, item:'mat_lata'},
  plastico: {n:'Plástico duro',   c:'#e2574c', atr:1.20, ind:1.80, w:[1,2.5],   bale:1, pellet:1, item:'mat_plastico'},
  vidro:    {n:'Vidro',           c:'#6fc27a', atr:0.15, ind:0.25, w:[2,4],     item:'mat_vidro'},
  sucata:   {n:'Sucata de metal', c:'#8f7462', atr:0.80, ind:1.20, w:[2,5],     bale:1, item:'mat_sucata'},
  oleo:     {n:'Óleo de cozinha', c:'#e8c24a', atr:1.20, ind:1.80, w:[1,2],     item:'mat_oleo'},
  eletro:   {n:'Eletrônicos',     c:'#5a6080', atr:2.50, ind:4.00, w:[2,4],     item:'mat_eletro'},
};
const MAT_IDS = Object.keys(MATS);
// participação (em kg) de cada material na coleta automática
const AUTO_MIX = {papelao:38, pet:18, lata:6, plastico:12, vidro:12, sucata:7, oleo:3, eletro:4};
const BALE_KG = 100;   // 1 fardo = 100 kg
const PELLET_MULT = 3; // grãos valem 3x
const BALE_MULT = 1.3; // fardos valem 30% a mais
const MIXED_FACTOR = 0.3; // misturado vale 30% da média

const REJ = [
  {n:'Resto de comida',        why:'Resto de comida é orgânico: vai para a compostagem, não para a reciclagem.'},
  {n:'Fralda usada',           why:'Fralda usada mistura materiais e está contaminada. É rejeito.'},
  {n:'Isopor sujo',            why:'Isopor sujo de comida é muito difícil de limpar e reciclar.'},
  {n:'Papel higiênico usado',  why:'Papel higiênico e guardanapo usados não podem ser reciclados.'},
  {n:'Caixa de pizza engordurada', why:'Papelão engordurado contamina o lote de papel limpo.'},
  {n:'Bituca de cigarro',      why:'Bituca de cigarro é rejeito e contamina os outros materiais.'},
];

const ROUTES = [
  {id:'bairro', n:'Rua do bairro', item:null, ph:1, items:22, rej:0.18, wm:1,
   mix:{papelao:5, pet:4, lata:2, plastico:2, vidro:2, sucata:1, oleo:1, eletro:0.5},
   d:'Casas e calçadas do bairro. Papelão e garrafas PET.'},
  {id:'feira', n:'Feira livre', item:'rota_feira', ph:2, items:28, rej:0.30, wm:1.1,
   mix:{papelao:5, pet:3, lata:5, plastico:3, vidro:1, sucata:0.5, oleo:0.5},
   d:'Barracas e caixotes. Muita latinha e papelão, mas muito resto de comida.'},
  {id:'centro', n:'Centro comercial', item:'rota_centro', ph:3, items:30, rej:0.12, wm:1.2,
   mix:{papelao:9, pet:2, lata:2, plastico:5, vidro:1, sucata:1, eletro:1.5},
   d:'Lojas e calçadão. Muito papelão das caixas e plástico duro.'},
  {id:'cond', n:'Condomínios parceiros', item:'rota_cond', ph:5, items:30, rej:0.05, wm:1.35,
   mix:{papelao:4, pet:3, lata:4, plastico:3, vidro:5, oleo:2, eletro:1},
   d:'Moradores que já separam o lixo. Material limpo e quase nenhum rejeito.'},
  {id:'pev', n:'Pontos de Entrega Voluntária', item:null, ph:6, items:34, rej:0.02, wm:1.6,
   mix:{papelao:4, pet:4, lata:3, plastico:4, vidro:4, sucata:2, oleo:3, eletro:3},

const nI = id => (S.items[id] || 0);
const has = id => nI(id) > 0;
function sum(o){ let t = 0; for (const k in o) t += o[k]; return t; }
function infra(){ return INFRA[S.phase - 1]; }
function achCount(){ return Object.keys(S.ach).length; }
function prod(){
  let b = 1;
  ['luvas_epi','botas','uniforme','oculos','protetor'].forEach(e => { if (has(e)) b += 0.05; });
  if (has('banheiro')) b += 0.05;
  if (has('vestiario')) b += 0.08;
  if (has('refeitorio')) b += 0.10;
  if (has('creche')) b += 0.10;
  if (has('centro_edu')) b += 0.10;
  b += 0.05 * nI('capacitacao');
  b += 0.03 * nI('painel');
  b += ACH_BONUS * achCount();
  return b;
}
function caps(){
  let mixed = 40, sep = 30;
  if (has('lona')) mixed += 60;
  if (S.phase >= 3) { mixed += 150; sep += 100; }        // barracão
  if (S.phase >= 5) { mixed += 1000; sep += 2000; }      // galpão de alvenaria
  if (S.phase >= 7) { mixed += 3000; sep += 6000; }      // estrutura profissional
  mixed += 150 * nI('baia') + 1500 * nI('galpao') + (has('terreno') ? 10000 : 0);
  sep += 50 * nI('bag') + 300 * nI('baia') + 3000 * nI('galpao') + (has('terreno') ? 20000 : 0);
  return {mixed, sep};
}
function sepUsed(){ return sum(S.sep) + 0.5 * (sum(S.bale) + sum(S.pellet)); }
function vagas(){
  return {
    coleta: nI('carroca') + nI('triciclo') + 2 * nI('caminhao'),

    prensa: S.phase >= 7 ? nI('prensa') + 2 * nI('linha_graos') : 0,

}
function coopCount(){ return sum(S.roles); }
function maxCoop(){ return PHASES[S.phase - 1].max - 1; }
function roleOpen(r){ return S.phase >= ROLES[r].ph; }
function matOn(m){ const it = MATS[m].item; return !it || has(it); }
function evOn(id){ return S.ev.some(e => e.id === id); }
function formal(){ return S.phase >= 5; }
function routeOn(r){ return r.item ? has(r.item) : S.phase >= r.ph; }
function kitCost(){ return ITEMS.filter(it => it.kit && has(it.id)).reduce((a, it) => a + it.kit, 0); }
function hireCost(){ return Math.ceil(40 * Math.pow(1.075, coopCount())) + kitCost(); }
function playerCap(){
  if (has('caminhao')) return 400;

  if (has('carroca_propria')) return 70;
  if (has('carrinho2')) return 40;

}
function tripTime(){ return 45 + 5 * nI('tempo'); }
function saleMult(){ return (has('rede') ? 1.25 : 1) * (1 + 0.05 * nI('logistica')); }
function price(m, form){
  const M = MATS[m];
  let p = formal() ? M.ind : M.atr;
  if (form === 'bale') p *= BALE_MULT;
  if (form === 'pellet') p *= PELLET_MULT;

}
function mixedValue(){
  let v = 0;

  return v * MIXED_FACTOR;
}
function itemLimit(it){
  if (it.uniq) return 1;

}
function itemMaxEver(it){ return it.uniq ? 1 : it.max ? it.max : it.lim ? Math.max(...it.lim) : Infinity; }
function itemCost(it, k){ return Math.ceil(it.cost * Math.pow(1.15, k == null ? nI(it.id) : k)); }
function costFor(it, q){ let c = 0; const k = nI(it.id); for (let i = 0; i < q; i++) c += itemCost(it, k + i); return c; }
function remainingQty(it){ return Math.max(0, itemLimit(it) - nI(it.id)); }
function maxAffordable(it){
  const rem = remainingQty(it); let c = 0, q = 0; const k = nI(it.id);
  while (q < rem) { const nc = itemCost(it, k + q); if (c + nc > S.money) break; c += nc; q++; }
  return q;
}
function reqMissing(it){ return (it.req || []).filter(r => !has(r)); }
// status: done | limit | avail | locked | hidden
function itemStatus(it){
  const k = nI(it.id);
  if (k >= itemMaxEver(it)) return 'done';
  if (it.ph > S.phase + 1) return 'hidden';
  if (it.ph > S.phase || reqMissing(it).length) return 'locked';

function rates(){
  const p = prod(), I = infra();
  let c = S.roles.coleta, col = 0;
  const a1 = Math.min(c, 2 * nI('caminhao')); col += a1 * 3; c -= a1;
  const a2 = Math.min(c, nI('triciclo')); col += a2 * 0.9; c -= a2;
  const a3 = Math.min(c, nI('carroca')); if (!evOn('pneu')) col += a3 * 0.4;
  col *= p * I * (has('mural') ? 1.1 : 1);
  const extra = (S.phase >= 6 ? 3 * I : 0) + nI('logistica') * 25 * I;
  let t = S.roles.triagem, tri = 0;
  const b1 = Math.min(t, 8 * nI('esteira')); tri += b1 * 1.5; t -= b1;
  const b2 = Math.min(t, 4 * nI('mesa')); tri += b2 * 0.6; t -= b2;
  const b3 = Math.min(t, 2 * nI('lona_triagem')); tri += b3 * 0.3;
  tri = tri * p * I + nI('separador') * 20 * I;
  if (evOn('mutirao')) tri *= 2;
  const emp = 1 + 0.2 * nI('empilhadeira');
  const ven = Math.min(S.roles.venda, nI('balanca')) * 3 * p * I * emp;
  let pr = S.phase >= 7 ? S.roles.prensa : 0;
  const g = Math.min(pr, 2 * nI('linha_graos')); pr -= g;
  const pp = Math.min(pr, nI('prensa'));
  const gra = g * 2 * p * I * (has('cisterna') ? 1.2 : 1);
  const pre = pp * 3.5 * p * I * emp;
  const money = (S.phase >= 6 ? 30 : 0) + nI('logistica') * 400;
  return {col, extra, tri, ven, gra, pre, money};
}
function rejFrac(){ return has('centro_edu') ? 0.05 : has('mural') ? 0.08 : 0.12; }

// =====================================================================
// MOVIMENTO DE MATERIAL
// =====================================================================
function autoWeights(){
  const w = {}; let T = 0;
  MAT_IDS.forEach(m => { if (matOn(m)) { w[m] = AUTO_MIX[m]; T += w[m]; } });
  for (const m in w) w[m] /= T;
  return w;
}
function addMixed(kg, rf){
  const w = autoWeights();
  for (const m in w) S.mixed[m] = (S.mixed[m] || 0) + kg * (1 - rf) * w[m];
  S.mixed.rej = (S.mixed.rej || 0) + kg * rf;
}
// remove kg proporcionalmente das chaves indicadas
function takeProp(store, keys, kg){
  let tot = 0; keys.forEach(k => tot += (store[k] || 0));
  const out = {};
  if (tot <= 1e-9 || kg <= 0) return out;
  const f = Math.min(1, kg / tot);
  keys.forEach(k => { const v = (store[k] || 0) * f; if (v > 0) { out[k] = v; store[k] -= v; if (store[k] < 1e-6) delete store[k]; } });
  return out;
}
function sortKg(amount){
  const tot = sum(S.mixed); if (tot <= 1e-6) return 0;
  amount = Math.min(amount, tot);
  const matShare = (tot - (S.mixed.rej || 0)) / tot;
  const space = caps().sep - sepUsed();
  if (amount * matShare > space) { if (space <= 0.01) { S._blkTri = true; return 0; } amount = space / Math.max(matShare, 1e-6); S._blkTri = true; }
  const out = takeProp(S.mixed, Object.keys(S.mixed), amount);
  for (const k in out) {
    if (k === 'rej') S.st.rejOut += out[k];
    else S.sep[k] = (S.sep[k] || 0) + out[k];
  }
  S.st.sorted += amount;
  return amount;
}
function sellStore(store, form, kg){
  const out = takeProp(store, Object.keys(store), kg);
  let money = 0, w = 0;
  for (const m in out) { money += out[m] * price(m, form); w += out[m]; }
  return {money, w};
}
function addMoney(v){ S.money += v; S.st.earned += v; }
function registerSale(r){
  if (r.w <= 0) return;
  addMoney(r.money); S.st.recycled += r.w; S.st.sales++;
  if (formal()) S.flags.semAtrav = 1;
}
function sellAuto(kg){
  let left = kg, total = {money:0, w:0};
  for (const [store, form] of [[S.pellet,'pellet'], [S.bale,'bale'], [S.sep,'sep']]) {
    if (left <= 0) break;
    const r = sellStore(store, form, left); left -= r.w; total.money += r.money; total.w += r.w;
  }
  registerSale(total);
  return total;
}
function sellAllManual(){
  const total = {money:0, w:0};
  for (const [store, form] of [[S.pellet,'pellet'], [S.bale,'bale'], [S.sep,'sep']]) {
    const r = sellStore(store, form, Infinity); total.money += r.money; total.w += r.w;
  }
  registerSale(total);
  return total;
}
function sellMixed(){
  const v = mixedValue(); let w = 0;
  for (const m in S.mixed) if (m !== 'rej') w += S.mixed[m];
  const rej = S.mixed.rej || 0;
  S.mixed = {};
  S.st.rejOut += rej;
  registerSale({money:v, w});
  return {money:v, w, rej};
}
function manualSortAmount(){ return 3 * infra() * prod(); }
function makeBales(kg){
  const keys = MAT_IDS.filter(m => MATS[m].bale && !(MATS[m].pellet && S.roles.prensa > 0 && nI('linha_graos') > 0));
  const out = takeProp(S.sep, keys, kg); let w = 0;
  for (const m in out) { S.bale[m] = (S.bale[m] || 0) + out[m]; w += out[m]; }
  S.st.baleKg += w;
}
function makePellets(kg){
  const out = takeProp(S.sep, ['pet','plastico'], kg); let w = 0;
  for (const m in out) { S.pellet[m] = (S.pellet[m] || 0) + out[m]; w += out[m]; }
  S.st.pelletKg += w;
}

// =====================================================================
// SIMULAÇÃO
// =====================================================================
function tick(dt, offline){
  S.t += dt;
  if (S.ev.length) S.ev = S.ev.filter(e => e.until > S.t);
  const r = rates(), cap = caps();
  S._blkCol = false; S._blkTri = false;
  const inflow = (r.col + r.extra) * dt;
  if (inflow > 0) {
    const space = cap.mixed - sum(S.mixed);
    if (space <= 0) S._blkCol = true;
    else {
      const a = Math.min(inflow, space); if (a < inflow) S._blkCol = true;
      const fc = r.col / (r.col + r.extra);
      addMixed(a * fc, rejFrac()); addMixed(a * (1 - fc), 0.03);
      S.st.autoKg += a;
    }
  }
  if (r.tri > 0) sortKg(r.tri * dt);
  if (r.gra > 0) makePellets(r.gra * dt);
  if (r.pre > 0) makeBales(r.pre * dt);
  if (r.ven > 0) sellAuto(r.ven * dt);
  if (r.money > 0) addMoney(r.money * dt);
  if (!offline) {
    checkAch();
    if (S.tut.done && S.phase >= 2) {
      S.nextEv -= dt;
      if (S.nextEv <= 0) { S.nextEv = 120 + Math.random() * 120; fireEvent(); }
    }
  }
}

function buy(id, q){
  const it = ITEM[id]; if (itemStatus(it) !== 'avail') return 0;
  q = Math.min(q, remainingQty(it));
  let bought = 0;
  while (bought < q) {
    const c = itemCost(it);
    if (S.money < c) break;
    S.money -= c; S.items[id] = nI(id) + 1; bought++;
  }
  return bought;
}
function freeVaga(r){ return vagas()[r] - S.roles[r]; }
function canHire(){ return S.phase >= 2 && coopCount() < maxCoop(); }
function hire(role){
  if (!canHire() || !roleOpen(role) || freeVaga(role) <= 0) return false;
  const c = hireCost(); if (S.money < c) return false;
  S.money -= c; S.roles[role]++; S.st.hires++;
  return true;
}
function moveRole(from, to){
  if (S.roles[from] <= 0 || !roleOpen(to) || freeVaga(to) <= 0) return false;
  S.roles[from]--; S.roles[to]++; return true;
}
function epiFull(){ return ['luvas_epi','botas','uniforme','oculos'].every(has); }
function reqList(){
  const P = PHASES[S.phase]; if (!P) return [];
  const out = [];
  P.reqs.forEach(([t, v]) => {
    let label, cur, need = v;
    if (t === 'trips') { label = `Fazer ${v} saídas para a rua`; cur = S.st.trips; }
    else if (t === 'working') { label = `${v} pessoas trabalhando (com você)`; cur = 1 + coopCount(); }
    else if (t === 'coop') { label = `${v} cooperados`; cur = coopCount(); }
    else if (t === 'recycled') { label = `Reciclar ${fmtKg(v)}`; cur = S.st.recycled; }
    else if (t === 'item') { label = `Ter: ${ITEM[v].n.replace('EPI: ','EPI ')}`; cur = has(v) ? 1 : 0; need = 1; }
    else if (t === 'epiFull') { label = 'EPI completo para todos (luvas, botas, uniforme e óculos)'; cur = ['luvas_epi','botas','uniforme','oculos'].filter(has).length; need = 4; }
    else if (t === 'bales') { label = `Produzir ${v} fardos`; cur = Math.floor(S.st.baleKg / BALE_KG); }
    else if (t === 'pellets') { label = `Produzir ${fmtKg(v)} de grãos`; cur = S.st.pelletKg; }
    else if (t === 'logistica') { label = `${v} contratos de logística reversa`; cur = nI('logistica'); }
    out.push({label, cur, need, ok: cur >= need, money:false});
  });
  out.push({label:`${P.costName}: ${fmtMoney(P.cost)}`, cur:S.money, need:P.cost, ok:S.money >= P.cost, money:true});
  return out;
}
function phaseProgress(){
  const l = reqList(); if (!l.length) return 1;
  return l.reduce((a, r) => a + Math.min(1, r.cur / r.need), 0) / l.length;
}
function canAdvance(){ return S.phase < 10 && reqList().every(r => r.ok); }
function advance(){
  if (!canAdvance()) return null;
  S.money -= PHASES[S.phase].cost; S.phase++;
  const info = {phase:S.phase, converted:0};
  if (S.phase === 5 && nI('lona_triagem') > 0) {
    info.converted = nI('lona_triagem');
    S.items.mesa = nI('mesa') + info.converted; S.items.lona_triagem = 0;
  }
  return info;
}

function achCond(id){
  const st = S.st;
  switch (id) {
    case 'saida1': return st.trips >= 1;
    case 'cheio': return !!S.flags.cheio;
    case 'limpa': return !!S.flags.limpa;
    case 'venda1': return st.sales >= 1;
    case 'colega': return st.hires >= 1;
    case 't1': return st.recycled >= 1000;
    case 't10': return st.recycled >= 10000;
    case 't100': return st.recycled >= 100000;
    case 'chuva': return !!S.flags.chuva;
    case 'cnpj': return S.phase >= 5;
    case 'semAtrav': return !!S.flags.semAtrav;
    case 'coop10': return coopCount() >= 10;
    case 'coop50': return coopCount() >= 50;
    case 'prefeitura': return S.phase >= 6;
    case 'rotas': return ROUTES.every(routeOn);
    case 'epi': return epiFull() && has('protetor');
    case 'fardo1': return st.baleKg >= BALE_KG;
    case 'mats': return MAT_IDS.every(matOn);
    case 'grao1': return st.pelletKg >= 1;
    case 'milhao': return st.earned >= 1e6;
    case 'fase10': return S.phase >= 10;
  }
  return false;
}
function checkAch(){
  ACHS.forEach(a => { if (!S.ach[a.id] && achCond(a.id)) { S.ach[a.id] = Date.now(); HOOK.ach(a); } });
}
function eventOk(e){
  switch (e.id) {
    case 'lata2': return matOn('lata');
    case 'feira2': return has('rota_feira');
    case 'escola': return S.phase >= 3;
    case 'mutirao': return S.roles.triagem > 0;
    case 'chuva': return sum(S.mixed) > 5;
    case 'preco': return S.phase < 5;
    case 'pneu': return S.roles.coleta > 0 && nI('carroca') > 0 && !has('caminhao');
  }
  return true;
}
function fireEvent(forceId){
  const pool = EVENTS.filter(e => forceId ? e.id === forceId : eventOk(e));
  if (!pool.length) return;
  let W = pool.reduce((a, e) => a + e.w, 0), x = Math.random() * W, e = pool[0];
  for (const p of pool) { x -= p.w; if (x <= 0) { e = p; break; } }
  const ev = {id:e.id, t:e.t, d:e.d, good:e.good};
  const r = rates();
  if (e.id === 'doacao') {
    const kg = Math.max(15, Math.round((r.col + r.extra) * 40));
    addMixed(kg, 0.05); ev.d = `Um comércio do bairro doou ${fmtKg(kg)} de material para a cooperativa.`;
  } else if (e.id === 'escola') {
    const v = Math.max(40, Math.round(incomeEstimate() * 25));
    addMoney(v); ev.d = `Uma escola visitou a cooperativa para aprender sobre reciclagem e deixou uma doação de ${fmtMoney(v)}.`;
  } else if (e.id === 'chuva') {
    if (has('lona') || S.phase >= 5) { S.flags.chuva = 1; ev.good = 1; ev.d = S.phase >= 5 ? 'Choveu forte, mas o material estava protegido dentro do galpão!' : 'Choveu forte, mas a lona protegeu todo o material!'; }
    else {
      const lost = (S.mixed.papelao || 0) * 0.15;
      if (S.mixed.papelao) S.mixed.papelao -= lost;
      ev.d = `Sem cobertura, ${fmtKg(lost)} de papelão molhou e estragou. Uma lona evita isso.`;
    }
  }
  if (e.dur) S.ev.push({id:e.id, until:S.t + e.dur, t:e.t});
  HOOK.event(ev);
}
let _incHist = [];
function incomeEstimate(){ // R$/s aproximado da automação
  const r = rates();
  const sellKg = Math.min(r.ven, Math.max(r.tri, r.ven * 0.5));
  let avg = 0, T = 0; const w = autoWeights();
  for (const m in w) { avg += w[m] * price(m, 'sep'); T += w[m]; }
  return sellKg * (T ? avg / T : 0) + r.money;
}

function fmtNum(v, d){
  return v.toLocaleString('pt-BR', {minimumFractionDigits:d || 0, maximumFractionDigits:d || 0});
}
function fmtMoney(v){
  if (v >= 1e9) return 'R$ ' + fmtNum(v / 1e9, 2) + ' bi';
  if (v >= 1e6) return 'R$ ' + fmtNum(v / 1e6, 2) + ' mi';
  if (v >= 1e5) return 'R$ ' + fmtNum(Math.floor(v));
  return 'R$ ' + fmtNum(v, 2);
}
function fmtKg(v){
  if (v >= 1e6) return fmtNum(v / 1e6, 2) + ' mil t';
  if (v >= 1000) return fmtNum(v / 1000, v >= 1e5 ? 0 : 1) + ' t';
  return fmtNum(v, v < 10 && v % 1 ? 1 : 0) + ' kg';
}

const SAVE_KEY = 'cooperativa-idle-v1';
function save(){
  if (typeof localStorage === 'undefined') return;
  S.lastSave = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  const base = newState();
  if (d && d.v === 1) {
    for (const k in base) if (d[k] === undefined) d[k] = base[k];
    for (const k in base.st) if (d.st[k] === undefined) d.st[k] = 0;
    for (const k in base.roles) if (d.roles[k] === undefined) d.roles[k] = 0;
    S = d; return true;
  }
  S = base; return false;
}
function offlineProgress(){
  const el = Math.min(7200, Math.max(0, (Date.now() - (S.lastSave || Date.now())) / 1000));
  if (el < 30) return null;
  const before = {money:S.money, auto:S.st.autoKg, sorted:S.st.sorted, rec:S.st.recycled};
  const steps = Math.floor(el);
  for (let i = 0; i < steps; i++) tick(1, true);
  return {secs:el, money:S.money - before.money, col:S.st.autoKg - before.auto,
          sorted:S.st.sorted - before.sorted, sold:S.st.recycled - before.rec};
}

const AU = {
  ctx:null, master:null, sfxGain:null, musGain:null, noiseBuf:null,
  mode:'base', nextNote:0, step:0, timer:null,
  init(){

    this.ctx = new AC();

    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = S.set.sfx ? 0.5 : 0; this.sfxGain.connect(this.master);
    this.musGain = this.ctx.createGain(); this.musGain.gain.value = S.set.music ? 0.16 : 0; this.musGain.connect(this.master);
    const len = this.ctx.sampleRate * 0.5; this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.nextNote = this.ctx.currentTime + 0.1;

  },
  setVolumes(){

    const t = this.ctx.currentTime;
    this.sfxGain.gain.setTargetAtTime(S.set.sfx ? 0.5 : 0, t, 0.05);
    this.musGain.gain.setTargetAtTime(S.set.music ? 0.16 : 0, t, 0.3);
  },
  tone(f, t0, dur, type, vol, dest, f2){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || this.sfxGain); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(t0, dur, vol, freq, dest, q){
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 2000; f.Q.value = q || 1;
    g.gain.setValueAtTime(vol || 0.2, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxGain); s.start(t0); s.stop(t0 + dur + 0.05);
  },
  sfx(name){
    if (!this.ctx || !S.set.sfx) return;
    const t = this.ctx.currentTime;
    switch (name) {
      case 'pick': this.tone(520, t, 0.08, 'square', 0.18, null, 880); this.tone(880, t + 0.06, 0.07, 'triangle', 0.15); break;
      case 'grab': this.tone(300, t, 0.05, 'triangle', 0.12, null, 420); break;
      case 'drop': this.tone(260, t, 0.08, 'triangle', 0.12, null, 180); break;
      case 'rej': this.tone(160, t, 0.25, 'sawtooth', 0.16, null, 90); this.tone(120, t + 0.12, 0.2, 'square', 0.1); break;
      case 'full': this.tone(330, t, 0.1, 'square', 0.15); this.tone(262, t + 0.1, 0.2, 'square', 0.15); break;
      case 'tick': this.tone(1200, t, 0.03, 'square', 0.08); break;
      case 'end': [660, 523, 440, 330].forEach((f, i) => this.tone(f, t + i * 0.13, 0.18, 'square', 0.16)); break;
      case 'sort': this.noise(t, 0.12, 0.25, 900, null, 0.7); this.noise(t + 0.08, 0.1, 0.18, 1800); break;
      case 'sell': this.tone(988, t, 0.1, 'square', 0.15); this.tone(1319, t + 0.08, 0.25, 'square', 0.15); break;
      case 'buy': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, t + i * 0.06, 0.14, 'triangle', 0.2)); this.noise(t + 0.22, 0.15, 0.1, 6000); break;
      case 'deny': this.tone(200, t, 0.12, 'square', 0.12); this.tone(150, t + 0.1, 0.15, 'square', 0.12); break;
      case 'event': [784, 988, 1175].forEach((f, i) => this.tone(f, t + i * 0.1, 0.25, 'sine', 0.2)); break;
      case 'bad': this.tone(392, t, 0.2, 'triangle', 0.2); this.tone(311, t + 0.18, 0.35, 'triangle', 0.2); break;
      case 'ach': [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, t + i * 0.07, 0.3, 'triangle', 0.18)); this.tone(2093, t + 0.3, 0.4, 'sine', 0.1); break;
      case 'hammer': for (let i = 0; i < 6; i++) { this.noise(t + i * 0.35, 0.08, 0.35, 700, null, 2); this.tone(180, t + i * 0.35, 0.06, 'square', 0.1); } break;
      case 'phase': {
        const mel = [[523,0],[659,.15],[784,.3],[1047,.45],[784,.7],[1047,.85]];
        mel.forEach(([f, d]) => { this.tone(f, t + d, 0.3, 'square', 0.14); this.tone(f / 2, t + d, 0.3, 'triangle', 0.14); });
        [523, 659, 784, 1047].forEach(f => this.tone(f, t + 1.05, 1.1, 'triangle', 0.12));
        for (let i = 0; i < 8; i++) this.noise(t + 1.05 + i * 0.06, 0.05, 0.08, 5000 + i * 300);
        break;
      }
      case 'go': this.tone(392, t, 0.1, 'triangle', 0.18); this.tone(587, t + 0.1, 0.18, 'triangle', 0.18); break;
      case 'click': this.tone(700, t, 0.03, 'triangle', 0.1); break;
    }
  },
  // ----- música: progressão C - Am - F - G, pentatônica
  setMode(m){ this.mode = m; },
  schedule(){
    if (!this.ctx) return;
    const street = this.mode === 'street';
    const bpm = street ? 116 : 76, spb = 60 / bpm / 2; // colcheias
    while (this.nextNote < this.ctx.currentTime + 0.3) {
      if (S.set.music) this.playStep(this.step, this.nextNote, street, spb);
      this.nextNote += spb; this.step = (this.step + 1) % 64;
    }
  },
  playStep(s, t, street, spb){
    const chords = [[48,52,55],[45,48,52],[41,45,48],[43,47,50]];
    const bar = Math.floor(s / 16) % 4, pos = s % 16, ch = chords[bar];
    const mf = n => 440 * Math.pow(2, (n - 69) / 12);
    const D = this.musGain;
    if (pos === 0) ch.forEach(n => this.tone(mf(n + 12), t, spb * 15, 'triangle', 0.05, D));
    if (pos % (street ? 4 : 8) === 0) this.tone(mf(ch[0] - 12), t, spb * (street ? 3 : 7), street ? 'square' : 'triangle', street ? 0.05 : 0.09, D);
    if (street && pos % 4 === 2) this.tone(mf(ch[2] - 12), t, spb * 1.5, 'square', 0.035, D);
    const scale = [60,62,64,67,69,72,74,76];
    const seed = (s * 7 + bar * 13) % 11;
    if (street) {
      if (pos % 2 === 0 && seed < 7) this.tone(mf(scale[(seed + bar * 2) % 8] + 12), t, spb * 0.9, 'square', 0.035, D);
      if (pos % 2 === 1) this.noise(t, 0.04, 0.05, 8000, D, 0.5);
      if (pos % 8 === 4) this.noise(t, 0.1, 0.09, 1500, D, 0.8);
    } else {
      if (pos % 4 === 0 && seed < 6) this.tone(mf(scale[(seed + bar) % 8] + 12), t, spb * 3.5, 'sine', 0.07, D);
    }
  },
};

function personLook(i){

  return {skin:SKINS[Math.floor(r() * 6)], hair:HAIRS[Math.floor(r() * 6)], shirt:SHIRTS[Math.floor(r() * 8)],
          pants:['#3b4a6b', '#4a3b2b', '#2b2b2b', '#5a6a3a'][Math.floor(r() * 4)], long:r() < 0.45, cap:r() < 0.25};

function curEpi(){
  return {gloves:has('luvas_epi'), boots:has('botas'), uniform:has('uniforme'), goggles:has('oculos'), ear:has('protetor')};
}
function drawPerson(x, y, look, pose, t, epi, flip){
  x = Math.round(x); y = Math.round(y);
  epi = epi || {};
  const shirt = epi.uniform ? '#2f7d4a' : look.shirt;
  const pants = epi.uniform ? '#2d4a63' : look.pants;
  const hand = epi.gloves ? '#e8a531' : look.skin;
  const foot = epi.boots ? '#1e1e1e' : '#6b4a2a';
  let off = 0, l1 = 0, l2 = 0;
  if (pose === 'walk') { const f = Math.floor(t * 8) % 4; l1 = f === 1 ? -1 : 0; l2 = f === 3 ? -1 : 0; off = (f % 2) ? -1 : 0; }
  if (pose === 'bend') off = 3;
  // sombra
  CX.globalAlpha = 0.25; rect(x - 4, y, 9, 1, '#000'); CX.globalAlpha = 1;
  // pernas
  if (pose === 'bend') {
    rect(x - 3, y - 3, 3, 2, pants); rect(x + 1, y - 3, 3, 2, pants);
    rect(x - 3, y - 1, 2, 1, foot); rect(x + 2, y - 1, 2, 1, foot);
  } else {
    rect(x - 2, y - 5 + l1, 2, 4, pants); rect(x + 1, y - 5 + l2, 2, 4, pants);
    rect(x - 2, y - 1 + l1, 2, 1, foot); rect(x + 1, y - 1 + l2, 2, 1, foot);
  }
  const ty = y - 10 + off;
  rect(x - 3, ty, 6, 5, shirt);
  if (epi.uniform) rect(x - 3, ty + 3, 6, 1, '#e8e05a');
  // braços
  if (pose === 'work') {
    const a = Math.floor(t * 4 + x) % 2;
    rect(x - 4, ty + (a ? 0 : 1), 1, 3, shirt); rect(x - 4, ty + (a ? 3 : 4), 1, 1, hand);
    rect(x + 3, ty + (a ? 1 : 0), 1, 3, shirt); rect(x + 3, ty + (a ? 4 : 3), 1, 1, hand);
  } else if (pose === 'push') {
    rect(flip ? x - 5 : x + 3, ty + 2, 2, 1, shirt); rect(flip ? x - 6 : x + 5, ty + 2, 1, 1, hand);
  } else if (pose === 'bend') {
    const a = Math.floor(t * 3 + x) % 2;
    rect(x - 4, ty + 2, 1, 3, shirt); rect(x - 4, ty + 5 - a, 1, 1, hand);
    rect(x + 3, ty + 2, 1, 3, shirt); rect(x + 3, ty + 5 - (1 - a), 1, 1, hand);
  } else {
    rect(x - 4, ty, 1, 4, shirt); rect(x - 4, ty + 4, 1, 1, hand);
    rect(x + 3, ty, 1, 4, shirt); rect(x + 3, ty + 4, 1, 1, hand);
  }
  // cabeça
  const hy = ty - 4;
  rect(x - 2, hy, 4, 4, look.skin);
  rect(x - 2, hy - 1, 4, 2, look.hair);
  if (look.long) rect(flip ? x + 1 : x - 3, hy, 1, 4, look.hair);
  px(flip ? x - 1 : x + 1, hy + 2, '#222');
  if (look.cap && !epi.uniform) { rect(x - 2, hy - 1, 4, 1, '#c0392b'); rect(flip ? x - 3 : x + 2, hy, 2, 1, '#c0392b'); }
  if (epi.goggles) rect(x - 2, hy + 1, 4, 1, '#9fd8ff');
  if (epi.ear) { rect(x - 3, hy + 1, 1, 2, '#e04a2a'); rect(x + 2, hy + 1, 1, 2, '#e04a2a'); }
}

function compColors(store){
  const out = []; let T = 0; for (const k in store) T += store[k];
  if (T <= 0) return ['#b8864b'];
  for (const k in store) { const n = Math.round(store[k] / T * 12); const col = k === 'rej' ? '#6b6b4a' : MATS[k].c; for (let i = 0; i < n; i++) out.push(col); }
  return out.length ? out : ['#b8864b'];
}
function drawPile(cx, by, size, cols, seed){
  // monte em forma de cúpula; size 0..1
  if (size <= 0.001) return;
  const w = 10 + size * 60, h = 4 + size * 26;

  for (let i = 0; i < w * h * 0.35; i++) {

    const xx = cx + a * w / 2, yy = by - b * h * Math.sqrt(1 - a * a);
    rect(xx, yy, 2 + (r() < 0.3 ? 1 : 0), 2, cols[Math.floor(r() * cols.length)]);

function buildBaseBg(){
  const sig = baseSig();
  if (bgCache.sig === sig && bgCache.c) return bgCache.c;
  const c = bgCache.c || mkCanvas(W * RES, H * RES);
  const g = c.getContext('2d'); g.setTransform(RES, 0, 0, RES, 0, 0); g.imageSmoothingEnabled = false;
  const old = CX; CX = g;
  g.clearRect(0, 0, W, H);
  drawSky(); drawGround(); drawFence();
  if (S.phase === 1) drawWeeds();
  if (S.phase >= 3 && S.phase <= 4) drawBarracao();
  if (S.phase >= 5) drawGalpao();
  if (!has('terreno')) drawTree(354, 112, 1.2);
  if (S.phase <= 4) drawTree(372, 200, 1);
  if (S.phase >= 2 && S.phase <= 4) {
    // tambor d'água, banquinho e vasinho de planta
    rect(270, 92, 10, 14, '#3a7fc4'); rect(270, 92, 10, 2, '#5b9bd5'); rect(270, 99, 10, 1, '#2c5f9e');
    rect(250, 102, 14, 3, '#8b5a2b'); rect(251, 105, 2, 3, '#5c3a1e'); rect(261, 105, 2, 3, '#5c3a1e');
    rect(284, 100, 6, 6, '#b5492f'); rect(285, 96, 4, 4, '#5fa04a'); px(287, 95, '#e07ab0');
  }
  drawLeftBuildings(); drawRightLot();
  if (!has('cisterna') && S.phase >= 9 && has('terreno')) {}
  // baias (fase 4+)
  const nb = Math.min(nI('baia'), 6);
  for (let i = 0; i < nb; i++) { const x = 6 + i * 22, y = 210; rect(x, y - 16, 20, 16, '#9c968a'); rect(x + 2, y - 14, 16, 12, '#7a7468'); }
  CX = old;
  bgCache.sig = sig; bgCache.c = c;
  return c;
}

function routeById(id){ return ROUTES.find(r => r.id === id); }
function pickWeighted(obj){
  let T = 0; for (const k in obj) T += obj[k];
  let x = Math.random() * T; for (const k in obj) { x -= obj[k]; if (x <= 0) return k; }
  return Object.keys(obj)[0];
}
function makeStreetItem(route, forceKind){
  const scale = Math.max(1, playerCap() / 40) * route.wm;
  let it;
  const isRej = forceKind ? forceKind === 'rej' : Math.random() < route.rej;
  if (isRej) {
    const r = Math.floor(Math.random() * REJ.length);
    it = {kind:'rej', r, kg:(0.5 + Math.random()) * Math.max(1, playerCap() / 40), spr:SPR['rej' + r], name:REJ[r].n};
  } else {
    const mix = {}; for (const m in route.mix) if (matOn(m)) mix[m] = route.mix[m];
    const m = forceKind && forceKind !== 'mat' ? forceKind : pickWeighted(mix);
    const w = MATS[m].w;
    it = {kind:'mat', m, kg:(w[0] + Math.random() * (w[1] - w[0])) * scale, spr:SPR[m], name:MATS[m].n};
  }
  it.kg = Math.round(it.kg * 10) / 10;
  // posição livre
  let best = null;
  for (let k = 0; k < 20; k++) {
    const x = 8 + Math.random() * 128, y = 64 + Math.random() * 38;
    const ok = trip.items.every(o => o.state !== 'ground' || Math.hypot(o.x - x, o.y - y) > 14);
    best = {x, y}; if (ok) break;
  }
  it.x = best.x; it.y = best.y; it.state = 'ground'; it.born = trip.elapsed; it.id = Math.random();
  trip.items.push(it); trip.spawned++;
  return it;
}
function startTrip(routeId){

          got:0, rejN:0, drag:null, flying:[], helpers:[], lastSec:99, ended:false, cartRect:{x:140, y:60, w:46, h:40}, tut:!S.tut.done && S.st.trips === 0};
  const first = Math.min(total, 11);

function cartAdd(it){

    return false;
  }
  const key = it.kind === 'rej' ? 'rej' : it.m;
  trip.cart[key] = (trip.cart[key] || 0) + it.kg; trip.cartKg += it.kg;
  if (it.kind === 'rej') {
    trip.rejN++;
    AU.sfx('rej');
    floatText('Rejeito!', trip.cartRect.x + 20, trip.cartRect.y, 'bad', true);
    toast('🚫 ' + it.name + ' é rejeito', REJ[it.r].why + ' Ocupou ' + fmtKg(it.kg) + ' do carrinho.', 'bad', 5000);

function flyToCart(it, from){

function updateStreet(dt){
  if (!trip) return;
  if (!trip.ended && !busy) {
    trip.left -= dt; trip.elapsed += dt;
    const sec = Math.ceil(trip.left);
    if (sec <= 10 && sec !== trip.lastSec && sec > 0) { AU.sfx('tick'); trip.lastSec = sec; }
    if (trip.left <= 0) { trip.left = 0; endTrip(true); }
  }
  // novos itens aparecem aos poucos
  const ground = trip.items.filter(i => i.state === 'ground').length;
  if (trip.spawned < trip.total && ground < 13) {
    const interval = trip.time * 0.75 / Math.max(1, trip.total - 11);
    trip.spawnT = (trip.spawnT || 0) + dt;
    if (trip.spawnT > interval) { trip.spawnT = 0; makeStreetItem(trip.route); }
  }
  // voo até o carrinho
  for (const it of trip.flying) {
    it.ft += dt * 3;
    const cx = trip.cartRect.x + trip.cartRect.w / 2, cy = trip.cartRect.y + 8;
    it.x = it.fx + (cx - it.fx) * it.ft; it.y = it.fy + (cy - it.fy) * it.ft - Math.sin(it.ft * Math.PI) * 18;
    if (it.ft >= 1) {
      if (cartAdd(it)) it.state = 'gone';
      else { it.state = 'ground'; it.x = it.fx; it.y = it.fy; }
    }
  }
  trip.flying = trip.flying.filter(i => i.state === 'fly');
  trip.items = trip.items.filter(i => i.state !== 'gone');
  // ajudantes
  for (const h of trip.helpers) {
    if (trip.ended) break;
    if (!h.target) {
      h.cool -= dt;
      if (h.cool <= 0) {
        const free = trip.cap - trip.cartKg;
        const cand = trip.items.filter(i => i.state === 'ground' && i.kind === 'mat' && i.kg <= free && !trip.helpers.some(o => o.target === i) && trip.drag?.it !== i);
        if (cand.length) { cand.sort((a, b) => Math.hypot(a.x - h.x, a.y - h.y) - Math.hypot(b.x - h.x, b.y - h.y)); h.target = cand[0]; }
        else h.cool = 1;
      }
    } else {
      const it = h.target;
      if (it.state !== 'ground') { h.target = null; continue; }
      const dx = it.x - h.x, dy = it.y - h.y, d = Math.hypot(dx, dy), sp = 45 * dt;
      if (d < 3) { flyToCart(it); h.target = null; h.cool = Math.max(1.2, 5 - nI('ajudante') * 0.6); }
      else { h.x += dx / d * Math.min(sp, d); h.y += dy / d * Math.min(sp, d); h.flip = dx < 0; }
    }
  }
}
function updateStreetHud(){
  if (!trip) return;
  const s = Math.ceil(trip.left);
  $('timer').textContent = '⏱ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('timer').classList.toggle('warn', s <= 10);
  $('cartTxt').textContent = `${trip.route.n} · ${fmtNum(trip.cartKg, 1)} / ${fmtNum(trip.cap)} kg`;
  const f = Math.min(1, trip.cartKg / trip.cap);
  $('cartFill').style.width = (f * 100) + '%';
  $('cartFill').classList.toggle('full', f >= 0.97);
}
function endTrip(timeout){
  if (!trip || trip.ended) return;
  trip.ended = true;
  if (trip.drag) { trip.drag.it.state = 'ground'; trip.drag = null; }
  // itens que ainda voavam entram no carrinho
  for (const it of trip.flying) { cartAdd(it); it.state = 'gone'; }
  if (timeout) { AU.sfx('end'); floatText('Tempo esgotado!', SW / 2, SH / 2, 'bad', true); }
  const t = trip;
  setTimeout(() => {
    // descarrega na base
    let matKg = 0;
    for (const k in t.cart) { S.mixed[k] = (S.mixed[k] || 0) + t.cart[k]; if (k !== 'rej') matKg += t.cart[k]; }
    S.st.trips++; S.st.streetKg += t.cartKg; S.st.rejStreet += (t.cart.rej || 0);
    if (matKg >= 10 && !(t.cart.rej > 0)) S.flags.limpa = 1;
    transition(() => {
      G_mode = 'base'; AU.setMode('base'); trip = null;

}
function showTripSummary(t){

    : (t.cartKg >= 10 ? `<p style="color:var(--green)"><b>Nenhum rejeito! Saída limpa. ✨</b></p>` : '');

// ---------- ponteiro na rua
function streetPt(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX - r.left) / r.width * SW, y:(e.clientY - r.top) / r.height * SH};
}
function itemAt(p){
  let best = null, bd = 13;
  for (const it of trip.items) {
    if (it.state !== 'ground') continue;
    const d = Math.hypot(it.x - p.x, it.y - 3 - p.y);
    if (d < bd) { bd = d; best = it; }
  }
  return best;
}
function inCart(p, pad){
  const c = trip.cartRect; pad = pad || 6;
  return p.x > c.x - pad && p.x < c.x + c.w + pad && p.y > c.y - pad - 6 && p.y < c.y + c.h + pad;
}
function showItemTip(it, p){
  const tip = $('itemTip');
  if (!it) { tip.classList.add('hidden'); return; }
  tip.textContent = it.kind === 'rej' ? `${it.name} · rejeito` : `${it.name} · ${fmtKg(it.kg)}`;
  tip.style.left = (p.x / SW * 100) + '%'; tip.style.top = (p.y / SH * 100) + '%';
  tip.classList.remove('hidden');
}
cv.addEventListener('pointerdown', e => {
  AU.init();
  if (G_mode !== 'street' || !trip || trip.ended || busy) return;
  const p = streetPt(e), it = itemAt(p);
  if (!it) return;
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  trip.drag = {it, ox:it.x - p.x, oy:it.y - p.y, sx:p.x, sy:p.y, moved:0, pid:e.pointerId};
  it.state = 'drag';
  $('sceneWrap').classList.add('dragging');
  AU.sfx('grab');
  showItemTip(it, {x:it.x, y:it.y - 6});
});
cv.addEventListener('pointermove', e => {
  if (G_mode !== 'street' || !trip) return;
  const p = streetPt(e);
  if (trip.drag && trip.drag.pid === e.pointerId) {
    const d = trip.drag;
    d.it.x = Math.max(4, Math.min(SW - 4, p.x + d.ox)); d.it.y = Math.max(54, Math.min(SH - 2, p.y + d.oy));
    d.moved = Math.max(d.moved, Math.hypot(p.x - d.sx, p.y - d.sy));
    showItemTip(d.it, {x:d.it.x, y:d.it.y - 6});
  } else if (e.pointerType === 'mouse') {
    const it = itemAt(p); showItemTip(it, it ? {x:it.x, y:it.y - 6} : p);
  }
});
function dragEnd(e){
  if (!trip || !trip.drag || trip.drag.pid !== e.pointerId) return;
  const d = trip.drag, it = d.it, p = streetPt(e);
  trip.drag = null; $('sceneWrap').classList.remove('dragging');
  $('itemTip').classList.add('hidden');
  if (trip.ended) { it.state = 'ground'; return; }
  const tap = d.moved < 4;
  if (tap && has('luvas_coleta')) { it.x = d.sx + d.ox; it.y = d.sy + d.oy; flyToCart(it); return; }
  if (inCart(p, has('luvas_coleta') ? 10 : 6) || inCart({x:it.x, y:it.y}, 4)) {
    it.fx = it.x; it.fy = it.y;
    if (cartAdd(it)) it.state = 'gone';
    else { it.state = 'ground'; it.x = Math.min(it.x, trip.cartRect.x - 12); }
  } else {
    it.state = 'ground'; AU.sfx('drop');
    if (tap && !has('luvas_coleta')) toast(null, 'Arraste o material até o carrinho. Com <b>luvas de coleta</b> basta tocar.', '', 3000, 'arraste');
  }
}
cv.addEventListener('pointerup', dragEnd);
cv.addEventListener('pointercancel', dragEnd);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !trip?.drag) $('itemTip').classList.add('hidden'); });

// ---------- desenho da rua
function drawStreet(t){
  ctx.setTransform(RES * 2, 0, 0, RES * 2, 0, 0); ctx.imageSmoothingEnabled = false;
  CX = ctx;
  const bg = drawStreetBg(trip.route);
  ctx.drawImage(bg, 0, 0, SW, SH);
  // carrinho e jogador(a)
  const cols = compColors(trip.cart);
  const cr = drawPlayerVehicleStreet(146, 100, trip.cartKg / trip.cap, cols);
  trip.cartRect = cr;
  const pl = {skin:'#c58c5c', hair:'#2a1d14', shirt:'#e8b631', pants:'#3b4a6b', long:true};
  drawPerson(cr.x + cr.w + 6 > SW - 4 ? cr.x - 6 : cr.x + cr.w + 6, 101, pl, trip.drag ? 'work' : 'stand', t, {gloves:has('luvas_coleta'), boots:has('botas'), uniform:has('uniforme')}, true);
  // destaque do carrinho ao arrastar
  if (trip.drag) {
    const over = inCart({x:trip.drag.it.x, y:trip.drag.it.y}, 6);
    CX.globalAlpha = 0.25 + 0.15 * Math.sin(t * 8);
    rect(cr.x - 3, cr.y - 3, cr.w + 6, cr.h + 6, over ? '#62e06a' : '#ffe08a');
    CX.globalAlpha = 1;
  }
  // itens (ordenados por y)
  const list = trip.items.filter(i => i.state === 'ground' || i.state === 'drag' || i.state === 'fly').sort((a, b) => a.y - b.y);
  for (const it of list) {
    const s = it.spr; const lift = it.state === 'drag' ? 3 : 0;
    CX.globalAlpha = 0.25; rect(it.x - s.width / 2, it.y, s.width, 1, '#000'); CX.globalAlpha = 1;
    CX.drawImage(s, Math.round(it.x - s.width / 2), Math.round(it.y - s.height - lift));
    if (it.kind === 'rej' && it.r <= 2 && it.state === 'ground') { // mosquitinhos
      for (let k = 0; k < 2; k++) px(it.x - 2 + Math.round(Math.sin(t * 9 + k * 3 + it.id * 10) * 4), it.y - s.height - 3 + Math.round(Math.cos(t * 7 + k) * 2), '#222');
    }
  }
  // ajudantes
  trip.helpers.forEach((h, i) => drawPerson(h.x, h.y + 4, h.look, h.target ? 'walk' : 'stand', t + i, {gloves:1}, h.flip));
  if (trip.helpers.length && trip.helpers.length > 1) {}
}

  if (before <= 0.01) { toast(null, 'Não há material misturado para triar. Vá para a rua!', '', 2500, 'nomix'); return; }
  const done = sortKg(manualSortAmount());
  if (done <= 0) { AU.sfx('deny'); toast('Estoque de separado cheio!', 'Venda o material ou compre bags e baias para ganhar espaço.', 'bad', 3500, 'sepfull'); return; }

function doSell(){
  if (G_mode !== 'base' || busy) return;

function chooseRoute(){
  if (busy || G_mode !== 'base') return;
  AU.init();
  const open = ROUTES.filter(routeOn);
  if (open.length === 1 || !S.tut.done && S.st.trips === 0) { startTrip(open[0].id); return; }
  const html = ROUTES.map(r => {
    const on = routeOn(r);
    let lock = '';
    if (!on) {
      if (S.phase + 1 < r.ph) lock = '???';
      else if (r.id === 'pev') lock = 'Liberada pelo contrato com a prefeitura (fase 6).';

    }

    const mats = Object.keys(r.mix).filter(matOn).map(m => MATS[m].n).join(', ');

      <div><div class="rnm">${on ? '' : '🔒 '}${on || S.phase + 1 >= r.ph ? r.n : '???'}</div>
      <div class="muted">${on ? r.d + feira + '<br>Materiais: ' + mats + ' · Rejeito: ' + (r.rej >= 0.25 ? 'alto' : r.rej >= 0.12 ? 'médio' : r.rej >= 0.05 ? 'baixo' : 'quase nenhum') : lock}</div></div></button>`;
  }).join('');
  showModal('Para onde vamos?', `<p class="muted">Tempo: ${tripTime()} s · Carrinho: ${playerCap()} kg</p>${html}`, [{t:'Cancelar', cls:'alt'}], {onShow:m => {

  }});

// segurar para repetir (triar)
function holdRepeat(el, fn){
  let iv = null, to = null;
  const stop = () => { clearTimeout(to); clearInterval(iv); to = iv = null; };
  el.addEventListener('pointerdown', e => { AU.init(); e.preventDefault(); fn(); to = setTimeout(() => { iv = setInterval(fn, 140); }, 350); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, stop));
}

function doAdvance(){
  if (!canAdvance() || busy) return;
  if (G_mode !== 'base') return;
  const old = buildBaseBg(), oldBg = mkCanvas(old.width, old.height); oldBg.getContext('2d').drawImage(old, 0, 0);
  const info = advance(); if (!info) return;
  busy = true; AU.sfx('hammer');
  bgCache.sig = 'x';
  // durante a obra, ainda mostramos o cenário antigo? Mostramos andaimes por cima do novo.
  buildAnim = {t0:performance.now(), dur:3200, oldBg, cb:() => {
    busy = false; AU.sfx('phase');
    const P = PHASES[info.phase - 1];
    let extra = '';
    if (info.converted) extra += `<p style="background:#e8f5e0;border-radius:8px;padding:8px">🪑 <b>Melhoria!</b> As ${info.converted} lonas de triagem viraram ${info.converted} mesas de triagem. Ninguém perdeu a vaga: cada mesa tem 4 lugares e todo mundo trabalha em pé, na altura certa.</p>`;
    if (info.phase === 5) extra += `<p>🏭 <b>Venda direta:</b> agora a balança vende para a indústria, por um preço melhor.</p>`;
    if (info.phase === 7) extra += `<p>🗜 <b>Nova função: Prensa e beneficiamento.</b> Compre uma prensa e coloque alguém nessa função para produzir fardos.</p>`;
    if (info.phase === 8) extra += `<p>🔹 A linha de grãos usa a função <b>Prensa e beneficiamento</b> (2 pessoas por linha).</p>`;
    showModal(`Fase ${info.phase}: ${P.name}`, `<p>${P.msg}</p>${extra}<p><b>O que esta fase libera:</b></p><ul>${(P.libera || []).map(x => '<li>' + x + '</li>').join('')}</ul>
      <p class="muted">Pessoas na fase: até ${P.max} (com você). Os equipamentos têm novos limites.</p>`, [{t:'Vamos trabalhar!'}]);
    if (info.phase === 7) tipOnce('prensaRole', 'Nova função liberada', 'Prensa e beneficiamento: opera a prensa e a linha de grãos. Mude a função de alguém na Loja › Pessoas.');
    lastSig = ''; renderPanel(true); save();
  }};
}

  {id:'drag', street:1, txt:() => has('luvas_coleta') ? 'Toque num material reciclável para jogá-lo no carrinho.' : '<b>Arraste</b> um material reciclável (papelão, garrafa PET...) até o <b>carrinho</b>.',
   pt:() => { const it = trip && trip.items.find(i => i.state === 'ground' && i.kind === 'mat'); return it ? canvasPtToPage(it.x, it.y - 10, true) : null; }, done:() => trip && trip.got >= 1},
  {id:'rej', street:1, txt:'Cuidado com o <b>rejeito</b>: resto de comida, fralda, isopor sujo... Não vale nada e ocupa espaço no carrinho. Deixe na rua!', ok:1,
   pt:() => { const it = trip && trip.items.find(i => i.state === 'ground' && i.kind === 'rej'); return it ? canvasPtToPage(it.x, it.y - 10, true) : null; }, done:(s) => (performance.now() - s.t0) > 9000},
  {id:'back', street:1, txt:'Colete mais um pouco. Quando quiser, toque em <b>Voltar à base</b>. Se o tempo acabar, você volta sozinho(a).', el:() => $('btnBack'), done:() => G_mode === 'base' && !modalOpen()},
  {id:'sort', txt:'Toque em <b>Triar</b> para separar o material por tipo. O rejeito vai para o lixo. Toque várias vezes, ou segure.', el:() => $('hotSort'), done:() => sum(S.mixed) < 0.5},
  {id:'sell', txt:'Material separado vale mais. Toque em <b>Vender</b>: o atravessador pesa e paga.', el:() => $('hotSell'), done:() => S.st.sales >= 1},
  {id:'shop', txt:'Abra a <b>Loja</b> e compre seu primeiro item. Dica: o <b>Carrinho maior</b> leva mais material por saída.', el:() => curTab === 'loja' ? document.querySelector('[data-buy]:not(:disabled)') || $('tab-loja') : $('tab-loja'), done:() => S.flags.bought},
  {id:'wait', txt:null, done:() => S.phase >= 2,
   enter:() => toast('Continue assim!', 'Faça mais saídas, trie e venda. Na aba <b>Cooperativa</b> você vê o que falta para a fase 2, quando poderá chamar colegas.', 'fact', 9000)},
  {id:'hire', txt:'Agora você pode chamar colegas! Primeiro compre uma <b>Balança</b> (Estrutura) ou uma <b>Carroça para coletor</b> (Rua) para abrir uma vaga. Depois, em <b>Loja › Pessoas</b>, admita alguém e escolha a função.',
   el:() => curTab === 'loja' ? (curCat === 'pessoas' ? document.querySelector('[data-act="hire"]') : document.querySelector('.cat[data-cat="pessoas"]')) : $('tab-loja'), done:() => S.st.hires >= 1},
];
let tutState = {idx:-1, t0:0};
function updateTutorial(){
  const bub = $('tutBubble'), arr = $('tutArrow');
  if (S.tut.done || modalOpen() || busy) { bub.classList.add('hidden'); arr.classList.add('hidden'); return; }
  let step = TUT[S.tut.step];
  if (!step) { S.tut.done = true; toast('🎓 Tutorial concluído!', 'Agora é com você. Eventos e curiosidades vão aparecer de vez em quando. Bom trabalho!', 'good', 7000); return; }
  if (tutState.idx !== S.tut.step) { tutState = {idx:S.tut.step, t0:performance.now()}; step.enter && step.enter(); }
  if (step.done(tutState)) { S.tut.step++; return; }
  if (step.street && G_mode !== 'street') { // voltou da rua antes da hora
    if (step.id !== 'back') { S.tut.step = 3; } return;
  }
  if (!step.txt || (!step.street && G_mode === 'street')) { bub.classList.add('hidden'); arr.classList.add('hidden'); return; }
  let p = null;
  if (step.el) { const e = step.el(); if (e && e.offsetParent !== null) { const r = e.getBoundingClientRect(); p = {x:r.left + r.width / 2, y:r.top}; } }
  else if (step.pt) p = step.pt();
  const txt = typeof step.txt === 'function' ? step.txt() : step.txt;
  if (bub.dataset.step !== step.id + txt) {
    bub.dataset.step = step.id + txt;
    bub.innerHTML = `<div>${txt}</div><div class="tb">${step.ok ? '<button class="btn" id="tutOk">Entendi</button>' : ''}<button class="btn alt" id="tutSkip">Pular tutorial</button></div>`;
    $('tutSkip').onclick = () => { S.tut.done = true; S.tut.step = TUT.length; bub.classList.add('hidden'); arr.classList.add('hidden'); toast(null, 'Tutorial pulado. Dá para rever em <b>Como jogar</b> (botão ?).', '', 4000); };
    if (step.ok) $('tutOk').onclick = () => { S.tut.step++; };
  }
  bub.classList.remove('hidden');
  const bw = bub.offsetWidth, bh = bub.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  if (p && p.y > -20 && p.y < vh + 20) {
    arr.classList.remove('hidden');
    arr.style.left = p.x + 'px'; arr.style.top = (p.y - 2) + 'px';
    let by = p.y - 44 - bh; if (by < 60) by = p.y + 50;
    if (G_mode === 'street') { const cr = cv.getBoundingClientRect(); by = cr.bottom + 10; if (by + bh > vh - 6) by = cr.top + 50; }
    if (by + bh > vh - 6) by = Math.max(60, vh - bh - 6);
    bub.style.left = Math.max(6, Math.min(vw - bw - 6, p.x - bw / 2)) + 'px'; bub.style.top = by + 'px';
  } else {
    arr.classList.add('hidden');
    bub.style.left = Math.max(6, vw / 2 - bw / 2) + 'px'; bub.style.top = (vh - bh - 12) + 'px';
  }
}

// =====================================================================
// GANCHOS DA LÓGICA
// =====================================================================
HOOK.ach = a => {
  AU.sfx('ach');
  toast('🏆 Conquista: ' + a.n, a.d + ' <b>+2% de produtividade.</b>', 'ach', 6000);
  tipOnce('ach', 'Conquistas', 'Cada conquista dá +2% de produtividade para todo mundo. Veja todas na aba Conquistas.');
};
HOOK.event = ev => {
  AU.sfx(ev.good ? 'event' : 'bad');
  toast((ev.good ? '📣 ' : '⚠ ') + ev.t, ev.d, ev.good ? 'good' : 'bad', 7000);
  if (ev.id === 'chuva') rainUntil = performance.now() + 8000;
  tipOnce('events', 'Eventos', 'De vez em quando acontece algo na cidade. Os eventos ruins são raros e dá para evitá-los com melhorias, como a lona contra a chuva.');
  lastSig = '';
};

// =====================================================================
// LAÇO PRINCIPAL
// =====================================================================
let lastFrame = performance.now(), acc = 0, incomeHist = [], uiT = 0, factT = 0;
function catchUp(secs){
  const before = S.money;
  const steps = Math.min(7200, Math.floor(secs));
  for (let i = 0; i < steps; i++) tick(1, true);
  const g = S.money - before;
  if (g > 0.5) toast('Enquanto você estava fora', `A cooperativa ganhou <b>${fmtMoney(g)}</b>.`, 'good', 5000);
}
function render(t){
  if (G_mode === 'street' && trip) { drawStreet(t); return null; }
  ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.imageSmoothingEnabled = false; CX = ctx;
  const bgOld = buildAnim && buildAnim.oldBg && (performance.now() - buildAnim.t0) < buildAnim.dur * 0.9;
  ctx.drawImage(bgOld ? buildAnim.oldBg : buildBaseBg(), 0, 0, W, H);
  const shown = drawBaseDynamic(t);
  drawBuild(t);
  return shown;
}
function updateHud(shown){
  $('money').textContent = fmtMoney(S.money);
  // renda média dos últimos 10 s
  const now = performance.now();
  incomeHist.push([now, S.st.earned]); while (incomeHist.length > 2 && now - incomeHist[0][0] > 10000) incomeHist.shift();
  const [t0, e0] = incomeHist[0]; const rate = now - t0 > 1500 ? (S.st.earned - e0) / ((now - t0) / 1000) : 0;
  $('rate').textContent = '+' + fmtMoney(Math.max(0, rate)) + '/s';
  $('phaseChip').textContent = window.innerWidth < 600 ? `Fase ${S.phase}/10` : `Fase ${S.phase}/10 · ${PHASES[S.phase - 1].name}`;
  if (G_mode === 'street') { updateStreetHud(); return; }
  const mixT = sum(S.mixed), sv = sellableValue();
  const open = ROUTES.filter(routeOn);
  $('goSub').textContent = open.length > 1 ? 'Escolher rota' : open[0].n;
  $('sortSub').textContent = fmtKg(mixT) + ' misturado';
  $('sellSub').textContent = sv > 0 ? fmtMoney(sv) : (mixT > 0 ? 'só misturado' : 'nada a vender');
  const sp = S.phase <= 2 ? {x:56, y:128} : ZONES.sort, hb = $('hotSort');
  if (hb) { hb.style.left = (sp.x / W * 100) + '%'; hb.style.top = (sp.y / H * 100) + '%'; }
  const hs = $('hotSortKg'); if (hs) hs.textContent = mixT > 0 ? fmtKg(mixT) : '';
  const hl = $('hotSellLbl'); if (hl) hl.textContent = has('balanca') ? 'Vender' : 'Atravessador';
  $('hotSort')?.classList.toggle('pulse', mixT > 0.5 && S.phase <= 3);
  $('hotSell')?.classList.toggle('pulse', sv > 0.5 && S.phase <= 3);
  $('btnGo').disabled = busy;
  // contadores de pessoas além das desenhadas
  if (shown) ROLE_IDS.forEach(r => {
    const b = $('bdg-' + r); if (!b) return;
    const n = S.roles[r];
    if (n > 0 && n > (shown[r] || 0)) { b.textContent = `${ROLES[r].n} x${n}`; b.classList.remove('hidden'); } else b.classList.add('hidden');
  });
  EQUIP_BADGES.forEach(([id, lb, mx]) => {
    const b = $('eq-' + id); if (!b) return;
    const n = equipCount(id), show = n > mx && !(id === 'mesa' && nI('esteira') > 0 && n <= 2);
    if (show) { b.textContent = `${lb} x${n}`; b.classList.remove('hidden'); } else b.classList.add('hidden');
  });
  // bolinha da loja
  const any = CATS.some(c => catHasBuyable(c.id));
  $('dotLoja').classList.toggle('hidden', !any);
}
function frame(now){
  let dt = (now - lastFrame) / 1000; lastFrame = now;
  if (dt > 5) { catchUp(dt); dt = 0; }
  dt = Math.min(dt, 0.25);
  acc += dt;
  while (acc >= 0.2) { tick(0.2); acc -= 0.2; }
  if (G_mode === 'street') updateStreet(dt);
  const shown = render(now / 1000);
  uiT += dt;
  if (uiT > 0.25) { uiT = 0; updateHud(shown); renderPanel(); }
  else if (G_mode === 'street') updateStreetHud();
  updateTutorial();
  // curiosidades
  if (S.tut.done && !busy) {
    S.nextFact -= dt;
    if (S.nextFact <= 0) {
      S.nextFact = 110 + Math.random() * 70;
      const f = FACTS[S.factIdx % FACTS.length]; S.factIdx++;
      toast('🌱 Você sabia?', f, 'fact', 10000);
      $('tipTxt').innerHTML = '<b>Você sabia?</b> ' + f;
    }
  }
  requestAnimationFrame(frame);
}

// =====================================================================
// INÍCIO
// =====================================================================
function boot(){
  const had = load();
  const off = had ? offlineProgress() : null;
  setupHots();
  holdRepeat($('btnSort'), doSort);
  $('btnSell').onclick = () => { AU.init(); doSell(); };
  $('btnGo').onclick = () => { AU.init(); chooseRoute(); };
  $('btnBack').onclick = () => { AU.sfx('click'); endTrip(false); };
  updateSoundBtns();
  $('tipTxt').innerHTML = '<b>Dica:</b> ' + (S.phase === 1 ? 'no começo, a rua é sua principal fonte de renda. Encha o carrinho, trie e venda!' : FACTS[S.factIdx % FACTS.length]);
  document.addEventListener('pointerdown', () => AU.init(), {once:true});
  setInterval(() => { if (!resetting) save(); }, 5000);
  window.addEventListener('beforeunload', () => { if (!resetting) save(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !resetting) save(); });
  renderPanel(true);
  if (!had) {
    showModal('Bem-vindo(a) à cooperativa!', `
      <p>Você é um(a) catador(a) e guarda seu carrinho num terreno baldio do bairro.</p>
      <p>Cada garrafa, latinha e caixa de papelão que você recolhe deixa de ir para o lixão e volta para a indústria como matéria-prima. Seu trabalho é <b>essencial</b> para a cidade e para o meio ambiente.</p>
      <p>Com o tempo, outros catadores vão se juntar a você. Juntos, vocês vão transformar este terreno numa grande central de reciclagem.</p>`,
      [{t:'Pular tutorial', cls:'alt', fn:() => { S.tut.done = true; S.tut.step = TUT.length; }}, {t:'Começar!', fn:() => {}}]);
  } else if (off && (off.money > 0.01 || off.col > 1)) {
    const h = Math.floor(off.secs / 3600), m = Math.floor(off.secs % 3600 / 60);
    showModal('Enquanto você estava fora...', `<p>Você ficou fora por ${h ? h + ' h ' : ''}${m} min${off.secs >= 7200 ? ' (a cooperativa conta até 2 horas)' : ''}. A cooperativa continuou trabalhando:</p>
      <table class="sumTable"><tr><td>Material coletado</td><td>${fmtKg(off.col)}</td></tr><tr><td>Material triado</td><td>${fmtKg(off.sorted)}</td></tr>
      <tr><td>Material vendido</td><td>${fmtKg(off.sold)}</td></tr><tr><td><b>Ganho</b></td><td>${fmtMoney(off.money)}</td></tr></table>${off.sorted < 0.5 && off.col > 0 ? '<p class="muted">O material chegou, mas ninguém fez a triagem. Trie e venda, ou tenha triadores (a partir da fase 3).</p>' : ''}`, [{t:'Ótimo!'}]);
  }
  requestAnimationFrame(t => { lastFrame = t; requestAnimationFrame(frame); });
}
boot();

</script>
</body>
</html>
